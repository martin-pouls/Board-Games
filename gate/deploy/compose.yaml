# The access gate on the server: one container behind the shared Caddy proxy (deploy/caddy at the
# repo root), reachable only over the external "web" network. Caddy maps /gate/* to it and asks it
# (forward_auth) before serving the protected apps.
name: gate

services:
  app:
    build:
      # The repository root: the app builds with shared/ (see ../Dockerfile).
      context: ../..
      dockerfile: gate/Dockerfile
    # Built by CI for each commit; on the server TAG comes from deploy/.env (see deploy/server/).
    image: ghcr.io/martin-pouls/board-games/gate:${TAG:-latest}
    container_name: gate
    restart: unless-stopped
    volumes:
      # The secret and the passwords, written by deploy/setup-server.sh, owned by uid 65532, mode 600.
      - /etc/board-games/gate:/secrets:ro
    networks:
      - web

networks:
  web:
    external: true
