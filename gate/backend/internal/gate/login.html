<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Board Games</title>
<script>
// Same storage key and values as mode-watcher in the games and the start page's theme script, which
// share this origin: set before first paint, toggled by the button in the top-right corner.
(function () {
  var KEY = 'mode-watcher-mode', root = document.documentElement, mode = 'system';
  try { mode = localStorage.getItem(KEY) || 'system'; } catch (e) {}
  var media = matchMedia('(prefers-color-scheme: dark)');
  function apply(dark) { root.setAttribute('data-theme', dark ? 'dark' : 'light'); }
  apply(mode === 'dark' || (mode !== 'light' && media.matches));
  media.addEventListener('change', function (e) { if (mode !== 'light' && mode !== 'dark') apply(e.matches); });
  document.addEventListener('click', function (e) {
    if (!(e.target instanceof Element) || !e.target.closest('#theme-toggle')) return;
    mode = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    apply(mode === 'dark');
    try { localStorage.setItem(KEY, mode); } catch (e) {}
  });
})();
</script>
<style>
:root {
  color-scheme: light dark;
  --bg: #f5f5f4; --card: #ffffff; --fg: #1c1917; --muted: #57534e;
  --border: #d6d3d1; --accent: #1c1917; --accent-fg: #fafaf9; --ring: #2563eb; --error: #b91c1c;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme]) {
    --bg: #0c0a09; --card: #1c1917; --fg: #fafaf9; --muted: #a8a29e;
    --border: #44403c; --accent: #fafaf9; --accent-fg: #1c1917; --ring: #60a5fa; --error: #f87171;
  }
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #f5f5f4; --card: #ffffff; --fg: #1c1917; --muted: #57534e;
  --border: #d6d3d1; --accent: #1c1917; --accent-fg: #fafaf9; --ring: #2563eb; --error: #b91c1c;
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0c0a09; --card: #1c1917; --fg: #fafaf9; --muted: #a8a29e;
  --border: #44403c; --accent: #fafaf9; --accent-fg: #1c1917; --ring: #60a5fa; --error: #f87171;
}
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 1.5rem; padding: 1rem;
  background: var(--bg); color: var(--fg);
  font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
main {
  width: 100%; max-width: 22rem; padding: 1.5rem; background: var(--card);
  border: 1px solid var(--border); border-radius: 1rem;
}
h1 { margin: 0 0 .25rem; font-size: 1.5rem; }
p { margin: 0 0 1.25rem; color: var(--muted); }
label { display: block; margin-bottom: .25rem; font-size: .875rem; font-weight: 600; }
#password {
  -webkit-text-security: disc;
  width: 100%; padding: .625rem .75rem; font: inherit; color: var(--fg);
  background: transparent; border: 1px solid var(--border); border-radius: .5rem;
}
button {
  width: 100%; margin-top: 1rem; padding: .625rem .75rem; font: inherit; font-weight: 600;
  color: var(--accent-fg); background: var(--accent); border: 0; border-radius: .5rem; cursor: pointer;
}
input:focus-visible, button:focus-visible, a:focus-visible { outline: 3px solid var(--ring); outline-offset: 2px; }
p.error { margin: .75rem 0 0; color: var(--error); font-size: .875rem; }
footer { display: flex; gap: 1rem; font-size: .875rem; }
footer a { color: var(--muted); }
/* Where the start page has it: top right of its centred 48rem column (1rem padding, nudged .25rem out). */
#theme-toggle {
  position: absolute; top: .75rem; right: max(.75rem, calc(50% - 24rem + .75rem));
  width: 2rem; height: 2rem; margin: 0; padding: 0;
  display: none; align-items: center; justify-content: center;
  color: var(--fg); background: transparent; border-radius: .5rem;
}
@media (min-width: 40rem) { #theme-toggle { top: 1.5rem; } }
#theme-toggle:hover { background: var(--border); }
[data-theme] #theme-toggle { display: flex; }
#theme-toggle svg { width: 1rem; height: 1rem; }
[data-theme="dark"] #theme-toggle .moon, [data-theme="light"] #theme-toggle .sun { display: none; }
</style>
</head>
<body>
<!-- Hidden until the theme script has run (it sets data-theme). -->
<button id="theme-toggle" type="button" aria-label="Toggle light or dark mode">
  <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
  <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2m-7.07-14.07 1.41 1.41m11.32 11.32 1.41 1.41M2 12h2m16 0h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
</button>
<main>
  <h1>Board Games</h1>
  <p>Enter the password to play.</p>
  <form method="post" action="{{.Action}}">
    <label for="password">Password</label>
    <!-- A masked text field, not type=password: browsers would offer to save the shared password. -->
    <input id="password" name="password" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" required autofocus>
    <input type="hidden" name="next" value="{{.Next}}">
    <button type="submit">Enter</button>
    {{if .Message}}<p class="error" role="alert">{{.Message}}</p>{{end}}
  </form>
</main>
<footer>
  <a href="/board-games/impressum/">Impressum</a>
  <a href="/board-games/datenschutz/">Datenschutz</a>
</footer>
</body>
</html>
