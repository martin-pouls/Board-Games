# The Game on the server: one container behind the shared Caddy proxy (deploy/caddy at the repo
# root), reachable only over the external "web" network. Caddy maps /the-game/* to it.
name: the-game

services:
  app:
    build:
      context: ..
      args:
        BASE_PATH: /the-game
    # Built by CI for each commit; on the server TAG comes from deploy/.env (see deploy/server/).
    image: ghcr.io/martin-pouls/card-games/the-game:${TAG:-latest}
    container_name: the-game
    restart: unless-stopped
    volumes:
      - data:/data # SQLite DB: games survive redeploys
    networks:
      - web

volumes:
  data:

networks:
  web:
    external: true
