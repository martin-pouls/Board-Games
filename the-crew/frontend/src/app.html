<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="text-scale" content="scale" />
		<meta name="color-scheme" content="light dark" />
		<meta name="theme-color" content="#efe5d5" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<script>
			// Set the edition and theme before first paint (same storage key and values as
			// mode-watcher). The placeholder is replaced in vite.config.ts (EDITION or the Vite mode); the
			// colours and the favicon mirror src/lib/edition.ts and src/routes/theme-deep-sea.css.
			try {
				var deepSea = '__EDITION_FOR_APP_HTML__' === 'deepSea';
				var colors = deepSea ? ['#e7f3f1', '#04131d'] : ['#efe5d5', '#060a1a'];
				if (deepSea) {
					document.documentElement.setAttribute('data-edition', 'deepSea');
					document
						.querySelector('link[rel="icon"]')
						.setAttribute('href', '%sveltekit.assets%/favicon-deep-sea.svg');
				}
				var m = localStorage.getItem('mode-watcher-mode') || 'system';
				var dark =
					m === 'dark' || (m === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
				var r = document.documentElement;
				r.classList.toggle('dark', dark);
				r.style.colorScheme = dark ? 'dark' : 'light';
				document
					.querySelector('meta[name="theme-color"]')
					.setAttribute('content', dark ? colors[1] : colors[0]);
			} catch (e) {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
