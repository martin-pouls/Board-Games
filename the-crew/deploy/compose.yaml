# The Crew on the server: one container behind the shared Caddy proxy (deploy/caddy at the repo
# root), reachable only over the external "web" network. Caddy maps /the-crew/* to it.
name: the-crew

services:
  app:
    build:
      # The repository root: the app builds with shared/ (see ../Dockerfile).
      context: ../..
      dockerfile: the-crew/Dockerfile
      args:
        BASE_PATH: /the-crew
    # Built by CI for each commit; on the server TAG comes from deploy/.env (see deploy/server/).
    image: ghcr.io/martin-pouls/board-games/the-crew:${TAG:-latest}
    container_name: the-crew
    restart: unless-stopped
    environment:
      # A crew plays its 50 missions over many evenings: keep idle games (and their logbook) longer
      # than the default 7 days. The privacy policy states this.
      GAME_RETENTION: 720h
    volumes:
      - data:/data # SQLite DB: games survive redeploys
    networks:
      - web

volumes:
  data:

networks:
  web:
    external: true
