# Fox Duet on the server: one container behind the shared Caddy proxy (deploy/caddy at the repo
# root), reachable only over the external "web" network. Caddy maps /fox-duet/* to it.
name: fox-duet

services:
  app:
    build:
      # The repository root: the app builds with shared/ (see ../Dockerfile).
      context: ../..
      dockerfile: fox-duet/Dockerfile
      args:
        BASE_PATH: /fox-duet
    # Built by CI for each commit; on the server TAG comes from deploy/.env (see deploy/server/).
    image: ghcr.io/martin-pouls/board-games/fox-duet:${TAG:-latest}
    container_name: fox-duet
    restart: unless-stopped
    volumes:
      - data:/data # SQLite DB: games survive redeploys
    networks:
      - web

volumes:
  data:

networks:
  web:
    external: true
