<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="text-scale" content="scale" />
		<meta name="color-scheme" content="light dark" />
		<meta name="theme-color" content="#efe6d5" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<script>
			// Set the theme before first paint (same storage key and values as mode-watcher).
			try {
				var m = localStorage.getItem('mode-watcher-mode') || 'system';
				var dark =
					m === 'dark' || (m === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
				var r = document.documentElement;
				r.classList.toggle('dark', dark);
				r.style.colorScheme = dark ? 'dark' : 'light';
				document
					.querySelector('meta[name="theme-color"]')
					.setAttribute('content', dark ? '#14121c' : '#efe6d5');
			} catch (e) {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
