# Shared Caddy reverse proxy (the only container with public ports). Runs from /opt/caddy, deployed
# by CI (deploy/server/board-games-deploy) whenever this directory changes.
# App stacks join the "web" network created here and are proxied by container name.
name: caddy

services:
  caddy:
    image: caddy:2@sha256:685ae3d7c34d9b5f8caeddc5d14051db7bbd88ff1f5a2fa0c16bd8ca328fb7af
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    volumes:
      - ./conf:/etc/caddy:ro
      - data:/data # certificates
      - config:/config
    networks:
      - web

volumes:
  data:
  config:

networks:
  web:
    name: web
