# Sky Team on the server: one container behind the shared Caddy proxy (deploy/caddy at the repo
# root), reachable only over the external "web" network. Caddy maps /sky-team/* to it.
name: sky-team

services:
  app:
    build:
      # The repository root: the app builds with shared/ (see ../Dockerfile).
      context: ../..
      dockerfile: sky-team/Dockerfile
      args:
        BASE_PATH: /sky-team
    # Built by CI for each commit; on the server TAG comes from deploy/.env (see deploy/server/).
    image: ghcr.io/martin-pouls/board-games/sky-team:${TAG:-latest}
    container_name: sky-team
    restart: unless-stopped
    volumes:
      - data:/data # SQLite DB: games survive redeploys
    networks:
      - web

volumes:
  data:

networks:
  web:
    external: true
