/*
 * Cockpit panel: a brushed-aluminium panel with navy instrument wells, Pilot spaces in deep blue
 * with ice-blue numerals, Co-Pilot spaces in brick with backlit yellow numerals, black gauge strips,
 * green switch LEDs. Dice are the bold part: blue with white numerals, orange with dark numerals,
 * as the physical dice. By night the aluminium turns gunmetal and the glows carry the panel.
 * Token names follow the future sky-team/frontend/src/routes/layout.css.
 */
:root, .lt {
	--background: oklch(0.935 0.012 240);
	--foreground: oklch(0.24 0.035 258);

	--popover: var(--card);
	--popover-foreground: var(--foreground);
	--primary: oklch(0.34 0.1 262);
	--primary-foreground: oklch(0.975 0.008 240);
	--secondary: oklch(0.895 0.016 240);
	--secondary-foreground: var(--foreground);
	--muted: oklch(0.895 0.016 240);
	--muted-foreground: oklch(0.45 0.03 252);
	--accent: oklch(0.9 0.02 240);
	--accent-foreground: var(--foreground);
	--destructive: oklch(0.54 0.2 27);
	--border: oklch(0.3 0.04 255 / 17%);
	--input: oklch(0.3 0.04 255 / 20%);
	--ring: oklch(0.34 0.1 262);
	--radius: 0.6rem;

	/* Panel: brushed aluminium, its darker column strips, the hazard-yellow edge marks. */
	--panel: oklch(0.835 0.02 238);
	--panel-strip: oklch(0.765 0.022 240);
	--hazard: oklch(0.84 0.16 92);
	/* Instrument wells: navy, with the cyan glow of their frames and labels. */
	--well: oklch(0.29 0.075 262);
	--glow: oklch(0.84 0.1 222);
	/* Pilot: die body and numeral, space and its label. */
	--pilot: oklch(0.56 0.155 256);
	--pilot-ink: oklch(0.985 0.005 250);
	--pilot-well: oklch(0.31 0.115 263);
	--pilot-glow: oklch(0.85 0.09 232);
	/* Co-Pilot: die body and numeral (dark, as the physical dice), space and its backlit label. */
	--copilot: oklch(0.73 0.165 55);
	--copilot-ink: oklch(0.2 0.03 45);
	--copilot-well: oklch(0.43 0.135 33);
	--copilot-glow: oklch(0.9 0.14 90);
	/* Gauge strips (axis, speed, ice marker): black with white numbers, red crosses. */
	--gauge: oklch(0.21 0.012 255);
	--gauge-ink: oklch(0.96 0.005 250);
	--forbidden: oklch(0.6 0.21 27);
	/* Switch LEDs: lit green when deployed, dark when not. */
	--led: oklch(0.76 0.2 142);
	--led-off: oklch(0.36 0.02 250);

	--traffic: oklch(0.17 0.005 255);
	--intern: oklch(0.52 0.11 165);
	--plane: oklch(0.985 0.003 240);
	/* Attitude indicator (start-page art, game over): sky and earth. */
	--sky: oklch(0.72 0.11 232);
	--earth: oklch(0.56 0.085 62);
	/* Kerosene gauge: full green to empty red, as on the track. */
	--fuel-full: oklch(0.72 0.17 145);
	--fuel-empty: oklch(0.6 0.2 30);

	--level-yellow: oklch(0.84 0.16 88);

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
	background: var(--background);
	color: var(--foreground);
	font-family: 'IBM Plex Sans', system-ui, sans-serif;
	font-size: 16px;
	line-height: 1.5;
	-webkit-font-smoothing: antialiased;
}
.display { font-family: 'Saira', 'IBM Plex Sans', sans-serif; font-stretch: 112%; }
.mono { font-family: ui-monospace, 'Cascadia Mono', Consolas, monospace; }
svg.i { width: 16px; height: 16px; flex: none; }

/* ---------------- plan document ---------------- */
.doc { max-width: 1240px; margin: 0 auto; padding: 32px 16px 64px; }
.doc h1 { font-family: 'Saira', sans-serif; font-stretch: 112%; font-size: 32px; line-height: 1.15; margin: 0 0 8px; font-weight: 700; }
.doc h2 { font-family: 'Saira', sans-serif; font-stretch: 112%; font-size: 22px; margin: 48px 0 8px; font-weight: 700; }
.doc h3 { font-size: 16px; margin: 20px 0 6px; }
.doc p, .doc li { max-width: 74ch; }
.doc .lede { color: var(--muted-foreground); }
.doc table { border-collapse: collapse; font-size: 14px; margin: 8px 0 16px; display: block; overflow-x: auto; max-width: 100%; }
.doc th, .doc td { border-bottom: 1px solid var(--border); padding: 6px 12px 6px 0; text-align: left; vertical-align: top; }
.doc th { color: var(--muted-foreground); font-weight: 600; }
.sw { display: inline-block; width: 28px; height: 28px; border-radius: 6px; vertical-align: middle; border: 1px solid var(--border); }
.gallery { display: flex; flex-wrap: wrap; gap: 24px 20px; margin-top: 16px; align-items: flex-start; }
.shot { display: flex; flex-direction: column; gap: 6px; max-width: 100%; margin: 0; }
.shot figcaption { font-size: 13px; color: var(--muted-foreground); max-width: 375px; }
.frame {
	width: var(--fw, 375px); height: var(--fh, 812px);
	container-type: size; overflow: hidden; position: relative;
	background: var(--background); color: var(--foreground);
	border: 1px solid var(--border); border-radius: 22px;
}
.frame.scroll { overflow-y: auto; scrollbar-width: none; }
.solo .frame { border: 0; border-radius: 0; }
.dies { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

/* ---------------- game screen ---------------- */
.screen {
	--g: 12px;
	--cell: 47px;
	--die: 52px;
	--gap: 4px;
	--tok: 18px;
	height: 100%;
	display: grid;
	grid-template-columns: minmax(0, 1fr);
	grid-template-rows: auto auto auto 1fr auto auto;
	grid-template-areas: "head" "track" "mods" "panel" "hand" "action";
	gap: 6px;
	padding: 12px var(--g) max(12px, env(safe-area-inset-bottom));
	font-size: 14px; line-height: 1.25;
	font-variant-numeric: tabular-nums;
	position: relative;
}
@container (min-height: 740px) {
	.screen { --cell: 50px; --die: 58px; --gap: 5px; gap: 12px; }
}

/* Header rows: the shared headerRow (-mx-2 -mt-1, 32 px high, gap 6) with HeaderButtons (ghost,
   32 px, 16 px icon, muted). Table: Home, code, connection dot, the game's own label (here the
   scenario, as The Crew's "Mission 12"), then Rules, Give up and the theme toggle at the right end. */
.hd { grid-area: head; display: flex; align-items: center; gap: 6px; min-height: 32px; margin: -4px -8px 0; white-space: nowrap; font-size: 14px; }
.hd .code { font-weight: 600; letter-spacing: .1em; font-size: 16px; }
.hd .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--online); flex: none; }
.hd .sn { margin-left: 6px; display: inline-flex; align-items: center; gap: 6px; font-family: 'Saira', sans-serif; font-stretch: 112%; font-weight: 700; font-size: 16px; }
.hd .sn::before { content: ""; width: 4px; height: 14px; border-radius: 2px; background: var(--c); box-shadow: 0 0 0 1px var(--border); }
.hb { width: 32px; height: 32px; display: grid; place-items: center; color: var(--muted-foreground); border-radius: 8px; flex: none; }
.hbtn { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 10px; color: var(--muted-foreground); font-size: 14px; font-weight: 500; border-radius: 8px; white-space: nowrap; }
.tt .sun { display: none; }
@media (prefers-color-scheme: dark) {
	:root:not([data-theme="light"]) .tt .moon { display: none; }
	:root:not([data-theme="light"]) .tt .sun { display: block; }
}
:root[data-theme="dark"] .tt .moon { display: none; }
:root[data-theme="dark"] .tt .sun { display: block; }

/* approach + altitude */
.track { grid-area: track; display: flex; flex-direction: column; gap: 3px; }
.ap { display: flex; gap: 3px; }
.apc {
	flex: 1; min-width: 0; height: 46px; border-radius: 6px; position: relative;
	background: radial-gradient(120% 90% at 50% 100%, oklch(0.42 0.12 250), var(--well) 70%);
	display: flex; flex-direction: column; align-items: center; justify-content: space-between;
	padding: 3px 1px 4px; color: var(--plane);
}
.apc.past { opacity: .35; }
.apc.here { box-shadow: 0 0 0 2px var(--glow); }
.apc.here::before { content: ""; position: absolute; top: -6px; left: 50%; translate: -50% 0; border: 6px solid transparent; border-top-color: var(--hazard); border-bottom: 0; filter: drop-shadow(0 1px 0 var(--well)); }
.apc.aim { box-shadow: 0 0 0 2px var(--background), 0 0 0 4px var(--ring); }
.apc.here.aim { box-shadow: 0 0 0 2px var(--glow), 0 0 0 4px var(--ring); }
.apc .apt { position: absolute; inset: 3px 0 auto; text-align: center; font-size: 12px; font-weight: 700; line-height: 13px; color: var(--glow); }
.apc .apt svg { display: block; margin: 0 auto; width: 20px; height: 12px; }
.tm { display: flex; gap: 1px; height: 10px; padding: 1px 2px; border-radius: 3px; background: var(--plane); }
.tm i { width: 6px; height: 8px; position: relative; }
.tm i.ok::after { content: ""; position: absolute; left: 0; top: 1px; border: 3px solid transparent; border-top: 5px solid var(--gauge); border-bottom: 0; opacity: .55; }
.tm i.x::before, .tm i.x::after { content: ""; position: absolute; left: 2.5px; top: 0; width: 1.6px; height: 8px; background: var(--forbidden); rotate: 40deg; }
.tm i.x::after { rotate: -40deg; }
.tm i.cur { box-shadow: 0 2px 0 0 var(--hazard); }
.tm.none { visibility: hidden; }
.pl { display: flex; gap: 0; height: 14px; align-items: center; }
.pl svg { width: 13px; height: 13px; fill: var(--plane); }
.pl .n { font-size: 12px; font-weight: 700; margin-left: 1px; }
.trf { display: flex; gap: 1px; height: 9px; }
.trf i { width: 9px; height: 9px; border-radius: 2px; background: var(--plane); position: relative; }
.trf i::after { content: ""; position: absolute; inset: 3px; border-radius: 50%; background: var(--traffic); }
/* Altitude: the label is always centred; the first-player arrow and the reroll token are pinned to
   the cell's edges, so a token never shifts the label (tokens only ever sit on Pilot rounds). */
.alt { display: flex; gap: 3px; }
.alc { flex: 1; min-width: 0; height: 22px; border-radius: 4px; background: var(--well); color: var(--gauge-ink); font-size: 12px; line-height: 1; font-family: 'Saira', sans-serif; font-weight: 600; position: relative; display: grid; place-items: center; box-shadow: inset 0 0 0 1px var(--fp); opacity: .9; }
.alc.P { --fp: var(--pilot-glow); }
.alc.C { --fp: var(--copilot-glow); }
.alc .ar { position: absolute; top: 50%; translate: 0 -50%; border: 4px solid transparent; }
.alc.P .ar { left: 3px; border-right: 5px solid var(--fp); border-left: 0; }
.alc.C .ar { right: 3px; border-left: 5px solid var(--fp); border-right: 0; }
/* the token lies on the space's corner, as the physical token covers the printed icon */
.alc .rtok { position: absolute; right: -4px; bottom: -6px; --rt: 15px; z-index: 1; }
.alc.cur { box-shadow: inset 0 0 0 2px var(--fp); background: oklch(from var(--well) calc(l + .08) c h); opacity: 1; }
.alc.past { opacity: .4; }

/* Reroll token: the physical token is a navy disc with a blue and an orange die and two arrows.
   The same disc sits on the altitude track, in the supply on the reroll button and in the rules. */
.rtok {
	--rt: 18px; width: var(--rt); height: var(--rt); border-radius: 50%; flex: none; display: inline-grid; place-items: center;
	background: radial-gradient(circle, var(--well) 56%, transparent 58%), conic-gradient(from -90deg, var(--pilot) 0 50%, var(--copilot) 0);
	color: var(--gauge-ink); box-shadow: 0 1px 2px var(--shade);
}
.rtok svg { width: 62%; height: 62%; }
.rtok.gone { background: transparent; box-shadow: inset 0 0 0 1.5px oklch(from var(--foreground) l c h / 35%); color: transparent; }

/* Scenario extras: one chip per module (fuel, wind) and per ability card. Each opens its rules. */
.mods { grid-area: mods; display: flex; gap: 4px; }
.chip { height: 34px; border-radius: 8px; background: var(--card); border: 1px solid var(--border); display: flex; align-items: center; gap: 5px; padding: 0 7px; font-size: 13px; white-space: nowrap; flex: none; min-width: 0; }
.chip b { font-weight: 700; }
.chip.grow { flex: 1 1 0; }
.chip svg { color: var(--muted-foreground); }
.fbar { flex: 1; height: 8px; border-radius: 4px; background: linear-gradient(90deg, var(--fuel-empty), var(--hazard) 45%, var(--fuel-full)); position: relative; min-width: 30px; }
.fbar i { position: absolute; top: -3px; bottom: -3px; width: 3px; border-radius: 2px; background: var(--foreground); box-shadow: 0 0 0 1.5px var(--card); }
.ring { width: 20px; height: 20px; border-radius: 50%; border: 3px solid var(--panel-strip); position: relative; flex: none; }
.ring::after { content: ""; position: absolute; left: 50%; top: -1px; width: 2px; height: 9px; border-radius: 1px; background: var(--pilot); transform-origin: 50% 8px; transform: translateX(-50%) rotate(var(--rot)); }
/* An ability chip is a tiny card: the navy banner over the card face, ticked once used. */
.cardi { width: 15px; height: 20px; border-radius: 3px; flex: none; background: linear-gradient(var(--well) 0 6px, var(--muted) 6px); box-shadow: inset 0 0 0 1px var(--border); display: grid; place-items: end center; font-size: 10px; line-height: 13px; font-weight: 800; color: var(--foreground); }
.chip.abc { padding: 0 8px 0 5px; }
.chip.abc.used { color: var(--muted-foreground); }
/* used: the card lies face down */
.chip.abc.used .cardi { background: var(--well); box-shadow: inset 0 0 0 1px var(--border); }

/* panel */
.pwrap { grid-area: panel; display: flex; align-items: center; justify-content: center; min-height: 0; }
.panel {
	display: flex; gap: 6px; align-items: stretch; justify-content: center; width: 100%;
	padding: 5px; border-radius: 14px;
	background:
		repeating-linear-gradient(90deg, oklch(1 0 0 / 3%) 0 1px, transparent 1px 3px),
		var(--panel);
	box-shadow: inset 0 1px 0 oklch(1 0 0 / 22%), 0 1px 2px var(--shade);
	position: relative;
}
.panel::before, .panel::after { content: ""; position: absolute; width: 3px; height: 34px; border-radius: 2px; background: var(--hazard); top: 50%; }
.panel::before { left: -1px; } .panel::after { right: -1px; }
.pcol { display: flex; flex-direction: column; gap: var(--gap); padding: 3px; margin: -3px; border-radius: 10px; background: var(--panel-strip); }
.pmid { display: flex; flex-direction: column; gap: var(--gap); flex: 1 1 auto; min-width: 0; justify-content: flex-start; }
.prow { display: flex; gap: var(--gap); align-items: center; justify-content: center; }
.sp {
	width: var(--cell); height: var(--cell); flex: none; border-radius: 9px; position: relative;
	display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
	box-shadow: inset 0 2px 4px oklch(0 0 0 / 35%), inset 0 0 0 1px oklch(1 0 0 / 8%);
	color: var(--lab);
	font-size: 12px; line-height: 13px;
}
.sp.b { background: var(--pilot-well); --lab: var(--pilot-glow); }
.sp.o { background: var(--copilot-well); --lab: var(--copilot-glow); }
.sp.x { background: linear-gradient(135deg, var(--pilot-well) 50%, var(--copilot-well) 50%); --lab: var(--gauge-ink); }
.sp .v { font-family: 'Saira', sans-serif; font-stretch: 105%; font-weight: 700; font-size: 16px; line-height: 16px; text-shadow: 0 0 6px color-mix(in oklch, var(--lab) 45%, transparent); }
.sp svg { width: 18px; height: 18px; filter: drop-shadow(0 0 3px color-mix(in oklch, var(--lab) 40%, transparent)); }
.sp svg.att { width: 24px; height: 24px; }
.led { position: absolute; right: -3px; bottom: -3px; width: 14px; height: 14px; border-radius: 50%; background: var(--led-off); box-shadow: 0 0 0 2px var(--panel-strip); display: grid; place-items: center; font-size: 9px; font-weight: 900; color: transparent; }
.led.on { background: var(--led); color: oklch(0.22 0.06 145); box-shadow: 0 0 0 2px var(--panel-strip), 0 0 6px var(--led); }
/* Final round: a switch still up is a landing condition not met, so its LED shows red with a cross. */
.landing .led:not(.on):not(.brk) { background: var(--forbidden); color: oklch(0.99 0 0); }
.sp.closed { opacity: .4; }
.sp.closed .v { text-decoration: line-through; }
/* dice and pieces on the panel */
.pd { position: absolute; inset: 2px; border-radius: 8px; display: grid; place-items: center; font-family: 'Saira', sans-serif; font-stretch: 105%; font-weight: 700; font-size: 22px; line-height: 1; }
.pd.P { background: linear-gradient(150deg, oklch(from var(--pilot) calc(l + .08) c h), var(--pilot) 60%); color: var(--pilot-ink); box-shadow: inset 0 -2px 0 oklch(0 0 0 / 20%), inset 0 0 0 1px oklch(1 0 0 / 30%); }
.pd.C { background: linear-gradient(150deg, oklch(from var(--copilot) calc(l + .07) c h), var(--copilot) 60%); color: var(--copilot-ink); box-shadow: inset 0 -2px 0 oklch(0 0 0 / 18%); }
.pd.T { background: linear-gradient(150deg, oklch(0.32 0.01 255), var(--traffic) 60%); color: var(--plane); box-shadow: inset 0 -2px 0 oklch(0 0 0 / 40%); }
.pd.I { inset: 4px; border-radius: 50%; background: var(--intern); color: oklch(0.99 0 0); box-shadow: 0 0 0 2px oklch(1 0 0 / 70%); font-size: 18px; }
.sp.last .pd { box-shadow: 0 0 0 2px var(--panel), 0 0 0 4px var(--new-card); }
.sp.last::after { content: ""; position: absolute; top: -4px; left: -4px; width: 9px; height: 9px; border-radius: 50%; background: var(--new-card); box-shadow: 0 0 0 2px var(--panel); z-index: 2; }
/* selection */
.selecting .sp:not(.legal):not(.has) { opacity: .42; }
.selecting .sp.has:not(.target) { opacity: .9; }
.sp.legal { outline: 2px solid var(--ring); outline-offset: 1px; }
.sp.target { outline: 3px solid var(--ring); outline-offset: 2px; }
.sp.target::before { content: ""; position: absolute; inset: 5px; border-radius: 6px; border: 2px dashed var(--lab); opacity: .9; }

/* gauges inside the panel */
.gauge { flex: 1; display: flex; gap: 2px; padding: 3px; border-radius: 8px; background: var(--gauge); color: var(--gauge-ink); height: var(--cell); align-items: stretch; min-width: 0; }
/* Axis: −2 … +2 between the two red crosses, the Pilot half tinted blue, the Co-Pilot half orange;
   the aircraft symbol sits on the current position and banks toward that side. */
.axg i { flex: 1; min-width: 0; border-radius: 4px; position: relative; display: grid; place-items: center; font-style: normal; }
.axg i.P { background: color-mix(in oklch, var(--pilot) 34%, transparent); }
.axg i.C { background: color-mix(in oklch, var(--copilot) 30%, transparent); }
.axg i::before { content: ""; width: 2px; height: 30%; border-radius: 1px; background: oklch(from var(--gauge-ink) l c h / 50%); }
.axg i.zero::before { height: 55%; background: var(--gauge-ink); }
.axg i.end { color: var(--forbidden); }
.axg i.end::before, .axg i.cur::before { display: none; }
.axg i.end svg { width: 12px; height: 12px; }
.axg i.cur svg { width: 26px; height: 26px; color: var(--gauge-ink); rotate: var(--tilt); filter: drop-shadow(0 0 4px oklch(from var(--glow) l c h / 70%)); position: relative; z-index: 1; }
.landing .axg i.zero { box-shadow: inset 0 0 0 2px var(--led); }
/* Speed: the printed scale 2 … 12 with the blue and orange aerodynamics markers between the numbers;
   under it how far each band moves the plane (none, one, two). In the final round the scale shows
   the landing band left of the red brake marker instead. A preview rings the sum the move gives. */
.spd { position: relative; display: grid; grid-template-columns: repeat(11, minmax(0, 1fr)); grid-template-rows: 1fr 1fr; gap: 0; padding: 3px 2px; }
.spd .n { display: grid; place-items: center; font-family: 'Saira', sans-serif; font-stretch: 75%; font-weight: 600; font-size: 12px; line-height: 1; color: oklch(from var(--gauge-ink) l c h / 85%); }
.spd .n { min-width: 0; overflow: visible; white-space: nowrap; }
.spd .tk { width: 2px; height: 6px; border-radius: 1px; background: oklch(from var(--gauge-ink) l c h / 45%); }
.spd .z { grid-row: 2; display: grid; place-items: center; color: var(--gauge-ink); border-radius: 0 0 4px 4px; }
.spd .z svg { width: 16px; height: 12px; }
.spd .z1 { background: oklch(from var(--gauge-ink) l c h / 10%); }
.spd .z2 { background: oklch(from var(--gauge-ink) l c h / 20%); }
.spd .n.z1, .spd .n.z2, .spd .n.land { border-radius: 0; }
.spd .land { background: color-mix(in oklch, var(--led) 26%, transparent); }
.spd .z.land { color: var(--led); }
.spd .z.crash { color: var(--forbidden); }
.spd .n.aim { background: var(--gauge-ink); color: var(--gauge); border-radius: 3px; font-weight: 800; }
.spd .pin { position: absolute; top: 1px; bottom: 1px; width: 4px; margin-left: -2px; border-radius: 2px; }
.spd .pin.P { background: var(--pilot); box-shadow: 0 0 0 1px var(--pilot-glow); }
.spd .pin.C { background: var(--copilot); box-shadow: 0 0 0 1px var(--gauge); }
.spd .pin.R { background: var(--forbidden); box-shadow: 0 0 0 1px var(--gauge); }
/* Brakes: the red marker in its slot before the next brake, as on the board. */
.bslot { width: 6px; height: 60%; align-self: center; border-radius: 3px; flex: none; background: oklch(from var(--foreground) l c h / 14%); }
.bslot.on { height: 80%; background: var(--forbidden); box-shadow: 0 0 0 2px var(--panel); }
.icem { align-self: center; position: relative; width: calc(var(--cell) * 4 + var(--gap) * 3); height: 10px; border-radius: 5px; background: var(--gauge); }
.icem i { position: absolute; top: -4px; width: 8px; height: 18px; margin-left: -4px; border-radius: 3px; background: var(--forbidden); box-shadow: 0 0 0 2px var(--panel); }
.intern { display: flex; align-items: center; gap: 3px; justify-content: center; }
.toks { display: flex; gap: 1px; padding: 3px; border-radius: 12px; background: var(--panel-strip); }
.tok { width: var(--tok); height: var(--tok); border-radius: 50%; background: var(--intern); color: oklch(0.99 0 0); font-size: 12px; font-weight: 700; font-family: 'Saira', sans-serif; display: grid; place-items: center; }
.tok.gone { background: transparent; box-shadow: inset 0 0 0 1.5px oklch(from var(--foreground) l c h / 25%); color: transparent; }
.tok.nP { box-shadow: 0 0 0 2px var(--pilot); }
.tok.nC { box-shadow: 0 0 0 2px var(--copilot); }

/* hand (dice tray) and action bar; the tray also says whose turn it is */
.hand { grid-area: hand; display: flex; align-items: center; gap: 7px; padding: 7px; border-radius: 14px; background: var(--card); border: 1px solid var(--border); position: relative; min-height: calc(var(--die) + 16px); }
.hand.mine { box-shadow: 0 0 0 2px var(--ring); border-color: transparent; }
.who { margin-left: auto; text-align: right; font-size: 13px; color: var(--muted-foreground); line-height: 17px; min-width: 0; display: flex; flex-direction: column; align-items: flex-end; gap: 3px; }
.who b { color: var(--foreground); font-size: 14px; line-height: 18px; }
.hand.mine .who b { color: var(--primary); }
.talk { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; padding: 0 4px; font-size: 13px; line-height: 17px; color: var(--muted-foreground); }
.talk b { color: var(--foreground); font-size: 14px; line-height: 18px; }
.talk .got { display: inline-flex; align-items: center; gap: 5px; }
.die { width: var(--die); height: var(--die); border-radius: 11px; flex: none; display: grid; place-items: center; font-family: 'Saira', sans-serif; font-stretch: 105%; font-weight: 700; font-size: 27px; line-height: 1; position: relative; }
.die.P { background: linear-gradient(150deg, oklch(from var(--pilot) calc(l + .09) c h), var(--pilot) 55%); color: var(--pilot-ink); box-shadow: inset 0 -3px 0 oklch(0 0 0 / 22%), 0 1px 2px var(--shade); }
.die.C { background: linear-gradient(150deg, oklch(from var(--copilot) calc(l + .07) c h), var(--copilot) 55%); color: var(--copilot-ink); box-shadow: inset 0 -3px 0 oklch(0 0 0 / 18%), inset 0 0 0 1px oklch(0.45 0.12 45 / 55%), 0 1px 2px var(--shade); }
.die.T { background: linear-gradient(150deg, oklch(0.34 0.01 255), var(--traffic) 55%); color: var(--plane); }
.die.empty { background: transparent; box-shadow: inset 0 0 0 1.5px var(--border); }
.die.blank { color: transparent; opacity: .45; }
.die.hid::after { content: "?"; font-size: calc(var(--die) * .5); opacity: .8; }
.die.sel { translate: 0 -4px; box-shadow: 0 0 0 2px var(--card), 0 0 0 4px var(--ring), 0 6px 10px var(--shade); }
.die .mod { position: absolute; right: -7px; top: -9px; height: 18px; padding: 0 5px; border-radius: 9px; font-family: 'IBM Plex Sans', sans-serif; font-size: 12px; font-weight: 700; line-height: 18px; background: var(--foreground); color: var(--background); }
.die.rr::after { content: ""; position: absolute; inset: -5px; border-radius: 14px; border: 2px dashed var(--ring); }
.die.rr .rtok { position: absolute; right: -6px; bottom: -6px; --rt: 20px; }
.die.locked { opacity: .6; }
.fd { display: inline-flex; gap: 3px; }
.fd i { width: 12px; height: 12px; border-radius: 3px; background: var(--pc); }
.fd i.out { background: transparent; box-shadow: inset 0 0 0 1.5px var(--border); }
.action { grid-area: action; display: flex; gap: 6px; align-items: center; height: 44px; }
.btn { height: 44px; border-radius: 10px; border: 0; background: var(--secondary); color: var(--secondary-foreground); font: inherit; font-weight: 600; font-size: 15px; padding: 0 14px; display: flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap; }
.btn.pri { background: var(--primary); color: var(--primary-foreground); flex: 1; }
.btn.wait { flex: 1; font-weight: 500; color: var(--muted-foreground); }
.btn.out { background: transparent; box-shadow: inset 0 0 0 1px var(--border); }
.btn.dis { opacity: .45; }
.btn.rrb { padding: 0 10px 0 8px; gap: 5px; }
.btn.rrb b { font-weight: 700; }
.btn.rrb .rtok { --rt: 24px; }
.stepper { display: flex; align-items: center; border-radius: 10px; height: 44px; background: var(--secondary); }
.stepper .btn { width: 40px; padding: 0; background: transparent; font-size: 18px; }
.stepper .val { min-width: 44px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 14px; font-weight: 700; line-height: 15px; }
.cups { display: inline-flex; gap: 2px; }
.cups i { width: 8px; height: 8px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px var(--foreground); }
.cups i.f { background: var(--foreground); }

/* sheets over the table or the lobby: game over, ability cards, module rules */
.scrim { position: absolute; inset: 0; background: var(--shade); z-index: 4; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 5; background: var(--card); border-radius: 18px 18px 0 0; padding: 10px 16px max(16px, env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 12px; box-shadow: 0 -10px 30px var(--shade); max-height: 88%; overflow-y: auto; scrollbar-width: none; }
.sheet .grab { width: 36px; height: 4px; border-radius: 2px; background: var(--border); margin: 0 auto; flex: none; }
.sheet h2 { margin: 0; font-family: 'Saira', sans-serif; font-stretch: 112%; font-size: 26px; line-height: 1.1; font-weight: 700; }
.sheet p { margin: 0; color: var(--muted-foreground); font-size: 15px; }
.badge { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; padding: 2px 10px 2px 4px; border-radius: 12px; align-self: flex-start; }
.badge.won { background: color-mix(in oklch, var(--led) 25%, var(--card)); }
.badge.lost { background: color-mix(in oklch, var(--destructive) 18%, var(--card)); }
.badge .hz { width: 18px; height: 18px; border-radius: 50%; overflow: hidden; background: linear-gradient(var(--sky) 50%, var(--earth) 50%); rotate: var(--tilt, 0deg); }
.checks { display: flex; flex-wrap: wrap; gap: 6px; }
.checks span { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px 0 6px; border-radius: 15px; background: var(--muted); font-size: 14px; white-space: nowrap; }
.checks span b { font-weight: 700; }
.chk { width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 800; background: var(--led); color: oklch(0.2 0.05 145); flex: none; }
.chk.no { background: var(--destructive); color: oklch(0.99 0 0); }
.reveal { display: flex; gap: 6px; align-items: center; font-size: 14px; color: var(--muted-foreground); }
.reveal .die { --die: 34px; font-size: 19px; border-radius: 8px; }
.sheet .row { display: flex; gap: 8px; }
.sheet .row .btn { flex: 1; }
/* The ability card, after the physical card: navy title banner over the light face, a worked
   example, then the steps. One component for the lobby (Pick) and the table (refresher, Start). */
.abcard { border-radius: 14px; overflow: hidden; background: var(--background); box-shadow: inset 0 0 0 1px var(--border); }
.abcard .ban { background: var(--well); color: var(--gauge-ink); padding: 10px 14px; display: flex; align-items: center; gap: 10px; }
.abcard .ban h2 { font-size: 20px; color: var(--gauge-ink); }
.abcard .ban .when { margin-left: auto; font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 11px; background: oklch(from var(--gauge-ink) l c h / 16%); white-space: nowrap; }
.abcard .face { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 12px; }
.abcard .lead { margin: 0; font-size: 15px; line-height: 21px; color: var(--foreground); font-weight: 600; }
.abcard ol, .mcard ul { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; font-size: 14px; line-height: 20px; color: var(--foreground); }
.abcard li::marker, .mcard li::marker { color: var(--muted-foreground); font-weight: 700; }
.dia { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 12px 10px 8px; border-radius: 10px; background: var(--muted); }
.dia .die { --die: 42px; font-size: 23px; border-radius: 9px; }
.dia figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12px; color: var(--muted-foreground); }
.dia .slot { width: 50px; height: 50px; border-radius: 10px; box-shadow: inset 0 0 0 2px var(--well); display: grid; place-items: center; color: var(--muted-foreground); }
.dia .arw { color: var(--muted-foreground); font-size: 18px; padding-bottom: 18px; }
.sheet .hint { font-size: 13px; color: var(--muted-foreground); text-align: center; margin: 0; }
.mcard .ban { display: flex; align-items: center; gap: 10px; }
.mcard .ban .mi { width: 40px; height: 40px; border-radius: 10px; background: var(--well); color: var(--glow); display: grid; place-items: center; flex: none; }
.mcard .ban .mi svg { width: 22px; height: 22px; }
.mcard .ban h2 { font-size: 24px; }
.wring { display: grid; place-items: center; padding: 6px 0 0; }
.wring svg { width: 176px; height: 176px; }

/* ---------------- lobby ---------------- */
.lobby { min-height: 100%; display: flex; flex-direction: column; gap: 12px; padding: 12px 12px 0; font-size: 15px; }
.lhd { display: flex; align-items: center; min-height: 32px; margin: -4px -8px 0; gap: 6px; }
.lhd h1 { margin: 0; font-size: 18px; font-weight: 600; }
.lhd .end { margin-left: auto; display: flex; align-items: center; gap: 6px; }
.card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.card h3 { margin: 0; font-size: 16px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.card h3 .aside { margin-left: auto; font-size: 13px; font-weight: 500; color: var(--muted-foreground); }
.card h3 .lnk { margin-left: auto; font-size: 14px; font-weight: 600; color: var(--primary); }
.share h2 { margin: 0; font-family: 'Saira', sans-serif; font-stretch: 112%; font-size: 26px; font-weight: 700; line-height: 1.1; }
.share .cd { display: flex; align-items: baseline; gap: 8px; font-size: 13px; color: var(--muted-foreground); }
.share .cd b { color: var(--foreground); font-size: 16px; letter-spacing: .2em; }
.inp { height: 40px; border-radius: 9px; box-shadow: inset 0 0 0 1px var(--input); display: flex; align-items: center; padding: 0 10px; font-size: 15px; color: var(--muted-foreground); overflow: hidden; white-space: nowrap; }
.seat { display: flex; align-items: center; gap: 10px; height: 44px; }
.seat .role { width: 34px; height: 34px; border-radius: 8px; display: grid; place-items: center; font-family: 'Saira', sans-serif; font-weight: 700; font-size: 13px; }
.seat .role.P { background: var(--pilot); color: var(--pilot-ink); }
.seat .role.C { background: var(--copilot); color: var(--copilot-ink); }
.seat .who2 { display: flex; flex-direction: column; line-height: 18px; }
.seat .who2 span { font-size: 13px; color: var(--muted-foreground); }
.scn { display: flex; align-items: stretch; gap: 0; border-radius: 10px; overflow: hidden; background: var(--well); color: var(--gauge-ink); min-height: 56px; flex: none; }
.scn .band { width: 8px; background: var(--c); flex: none; }
.scn .body { flex: 1; display: flex; align-items: center; gap: 12px; padding: 8px 12px; min-width: 0; }
.scn .apc3 { font-family: 'Saira', sans-serif; font-stretch: 112%; font-weight: 800; font-size: 24px; line-height: 1; letter-spacing: .02em; width: 56px; flex: none; }
.scn .nm { min-width: 0; font-weight: 600; line-height: 18px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.scn .ic { margin-left: auto; display: flex; gap: 4px; align-items: center; flex: none; }
.scn .ic span { min-width: 24px; padding: 0 3px; gap: 1px; height: 24px; display: inline-flex; align-items: center; justify-content: center; border-radius: 6px; background: var(--plane); color: var(--traffic); font-size: 12px; font-weight: 800; font-family: 'Saira', sans-serif; }
.scn .ic span.rt { background: transparent; color: var(--gauge-ink); box-shadow: inset 0 0 0 1.5px oklch(from var(--gauge-ink) l c h / 45%); }
.scn .ic svg { width: 15px; height: 15px; }
.scn .ic span svg:not(:only-child) { width: 11px; height: 11px; }
.scn.sm { min-height: 46px; }
.scn.sm .apc3 { font-size: 19px; width: 44px; }
.scn.on { box-shadow: 0 0 0 2px var(--card), 0 0 0 4px var(--ring); }
.green { --c: var(--level-green); } .yellow { --c: var(--level-yellow); } .red { --c: var(--level-red); } .black { --c: var(--level-black); }
.black.scn .band { background: repeating-linear-gradient(45deg, var(--level-black) 0 4px, oklch(0.45 0 0) 4px 6px); }
/* The chosen scenario's flight, drawn with the table's own track pieces. */
.prev { display: flex; flex-direction: column; gap: 3px; padding-top: 6px; }
.prev .apc { height: 44px; }
.prev .apc.here { box-shadow: none; }
.mods2 { display: flex; flex-wrap: wrap; gap: 6px; }
.modchip { height: 36px; display: inline-flex; align-items: center; gap: 7px; padding: 0 10px 0 8px; border-radius: 9px; background: var(--secondary); font-size: 14px; font-weight: 600; }
.modchip .mi { width: 24px; height: 24px; border-radius: 6px; display: grid; place-items: center; background: var(--well); color: var(--glow); }
.modchip .mi svg { width: 15px; height: 15px; }
.modchip > svg { color: var(--muted-foreground); }
.modchip.open { box-shadow: 0 0 0 2px var(--ring); }
.abs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.ab { border-radius: 10px; padding: 0 0 10px; display: flex; flex-direction: column; gap: 4px; box-shadow: inset 0 0 0 1px var(--border); background: var(--card); position: relative; min-height: 98px; overflow: hidden; }
.ab .t { display: flex; align-items: center; gap: 6px; background: var(--well); color: var(--gauge-ink); padding: 6px 8px 6px 10px; }
.ab .t b { font-family: 'Saira', sans-serif; font-stretch: 85%; font-weight: 700; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ab .t .ck { margin-left: auto; width: 22px; height: 22px; border-radius: 6px; box-shadow: inset 0 0 0 1.5px oklch(from var(--gauge-ink) l c h / 55%); display: grid; place-items: center; font-size: 12px; font-weight: 800; flex: none; }
.ab p { margin: 0; padding: 2px 10px 0; font-size: 13px; line-height: 17px; color: var(--muted-foreground); }
.ab .more { margin-top: auto; padding: 0 10px; display: inline-flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 600; color: var(--primary); }
.ab .more svg { width: 14px; height: 14px; }
.ab.on { box-shadow: inset 0 0 0 2px var(--ring); }
.ab.on .ck { background: var(--glow); color: var(--well); box-shadow: none; }
.ab.off { opacity: .5; }
.sticky { position: sticky; bottom: 0; margin: auto -12px 0; padding: 8px 12px max(8px, env(safe-area-inset-bottom)); background: color-mix(in oklch, var(--background) 85%, transparent); backdrop-filter: blur(8px); }
.sticky .btn { height: 48px; width: 100%; font-size: 16px; }
.sticky p { margin: 0 0 6px; text-align: center; font-size: 13px; color: var(--muted-foreground); }
.picker .pkh { position: sticky; top: -10px; margin: -10px -16px 0; padding: 10px 16px 8px; background: var(--card); z-index: 1; display: flex; flex-direction: column; gap: 12px; }
.picker .list { display: flex; flex-direction: column; gap: 6px; }
.grp { font-size: 13px; color: var(--muted-foreground); font-weight: 600; margin: 6px 0 0; display: flex; align-items: center; gap: 6px; }
.grp::before { content: ""; width: 12px; height: 12px; border-radius: 3px; background: var(--c); box-shadow: 0 0 0 1px var(--border); }
.ovl { position: relative; height: 100%; overflow: hidden; }

/* ---------------- home (the shared HomePage with the game's hero) ---------------- */
.home { min-height: 100%; display: flex; flex-direction: column; padding: 12px; gap: 16px; font-size: 15px; }
.tb { display: flex; align-items: center; min-height: 32px; margin: -4px -8px 0; gap: 6px; }
.hero { padding: 0 0 18px; overflow: hidden; box-shadow: 0 10px 15px -3px oklch(0.2 0.03 255 / 12%); gap: 16px; }
.hero .band { display: block; width: 100%; height: 72px; }
.hero .hh { padding: 0 18px; display: flex; flex-direction: column; gap: 4px; }
.hero .hh h1 { margin: 0; font-family: 'Saira', sans-serif; font-stretch: 112%; font-weight: 800; font-size: 36px; line-height: 1.1; }
.hero .hh p { margin: 0; color: var(--muted-foreground); font-size: 15px; }
.hero .form { padding: 0 18px; display: flex; flex-direction: column; gap: 18px; }
.hero label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 6px; }
.hero .inp { height: 48px; font-size: 16px; }
.hero .btn.big { height: 48px; font-size: 16px; flex: none; }
.homecol { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 16px; }
.or { display: flex; align-items: center; gap: 12px; font-size: 14px; color: var(--muted-foreground); }
.or::before, .or::after { content: ""; flex: 1; height: 1px; background: var(--border); }
.grow-row { display: flex; gap: 8px; }
.grow-row .inp { flex: 1; justify-content: center; letter-spacing: .3em; font-size: 20px; }
.gamerow { min-height: 56px; border-radius: 10px; box-shadow: inset 0 0 0 1px var(--border); display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; }
.gamerow .c { display: flex; flex-direction: column; gap: 2px; }
.gamerow .c b { letter-spacing: .2em; font-weight: 600; }
.gamerow .c span { font-size: 12px; color: var(--muted-foreground); }
.gamerow .bdg { font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 8px; background: var(--secondary); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .hero { box-shadow: 0 10px 15px -3px oklch(0 0 0 / 30%); } }
:root[data-theme="dark"] .hero { box-shadow: 0 10px 15px -3px oklch(0 0 0 / 30%); }

/* ---------------- start page tiles ---------------- */
.stpage { background: var(--st-background); color: var(--st-foreground); min-height: 100%; padding: 12px; font-family: 'Inter', 'IBM Plex Sans', system-ui, sans-serif; }
.shelf { display: flex; flex-direction: column; gap: 10px; }
.tile { display: flex; align-items: center; gap: 14px; padding: 8px 12px 8px 8px; border-radius: 16px; box-shadow: 0 4px 6px var(--tile-shadow), 0 0 0 1px var(--ring-c); }
.tile .art { width: 88px; height: 88px; border-radius: 12px; overflow: hidden; flex: none; position: relative; }
.tile .art svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.tile h2 { margin: 0; font-size: 18px; line-height: 1.2; font-weight: 800; }
.tile .pl2 { font-size: 14px; }
.tile p { margin: 0; font-size: 14px; opacity: .9; line-height: 1.35; }
.tile .chev { margin-left: auto; flex: none; }
.t-crew { background: var(--crew-tile); --ring-c: color-mix(in oklch, var(--crew-accent) 30%, transparent); color: var(--st-foreground); }
.t-crew h2 { color: var(--crew-text); }
.t-deep { background: var(--deep-tile); --ring-c: color-mix(in oklch, var(--deep-accent) 30%, transparent); color: var(--st-foreground); }
.t-deep h2 { color: var(--deep-text); }
.t-sky { background: var(--sky-tile); --ring-c: var(--sky-ring); color: var(--sky-fg); }
.t-sky h2 { color: var(--sky-text); font-family: 'Saira', sans-serif; font-stretch: 112%; font-weight: 800; }
.t-sky .pl2, .t-sky .chev { color: var(--sky-muted); }
.t-crew .pl2, .t-deep .pl2, .t-crew .chev, .t-deep .chev { color: var(--st-muted); }
.wall { display: grid; grid-template-columns: repeat(3, 296px); gap: 16px; justify-content: center; padding-top: 24px; }
.wall .tile, .wcard { flex-direction: column; align-items: stretch; gap: 0; padding: 0; overflow: hidden; }
.wall .tile .art, .wcard .art { width: 100%; height: 132px; border-radius: 0; }
.wall .tile .txt, .wcard .txt { padding: 16px 18px 18px; display: flex; flex-direction: column; gap: 2px; }
.wall .tile h2, .wcard h2 { font-size: 20px; }
.wall .tile .chev, .wcard .chev { display: none; }

/* ---------------- round 3 options ---------------- */
/* 1. panel edge marks: gone, or a bar in your colour on your side */
.panel.edge-none::before, .panel.edge-none::after, .panel.edge-side::before, .panel.edge-side::after { display: none; }
.panel.edge-side.me-P::before, .panel.edge-side.me-C::after { display: block; top: 14px; bottom: 14px; height: auto; width: 4px; }
.panel.edge-side.me-P::before { left: -2px; background: var(--pilot); }
.panel.edge-side.me-C::after { right: -2px; background: var(--copilot); }
/* 2. axis */
.axg i.end { flex: .6; }
.axg i.cur svg { max-width: 100%; }
.axg.lit i.cur, .axg.num i.cur { background: oklch(from var(--gauge-ink) l c h / 20%); box-shadow: inset 0 0 0 2px var(--glow); overflow: visible; }
.axg.lit i.cur svg { width: 21px; height: 21px; max-width: none; filter: none; }
.axg.num i { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; }
.axg.num i::before { display: none; }
.axg.num i b { font-family: 'Saira', sans-serif; font-stretch: 75%; font-weight: 600; font-size: 12px; line-height: 12px; color: oklch(from var(--gauge-ink) l c h / 80%); }
.axg.num i.zero b { color: var(--gauge-ink); font-weight: 700; }
.axg.num i.cur b { color: var(--gauge-ink); font-weight: 800; }
.axg.num i.cur svg { width: 22px; height: 18px; max-width: none; filter: none; }
.landing .axg.lit i.zero, .landing .axg.num i.zero { box-shadow: inset 0 0 0 2px var(--led); }
.landing .axg.lit i.zero.cur, .landing .axg.num i.zero.cur { box-shadow: inset 0 0 0 2px var(--led); background: color-mix(in oklch, var(--led) 28%, transparent); }
.axg.dial { padding: 2px; }
.axg.dial svg { width: 100%; height: 100%; display: block; }
/* 3. speed */
.spd.full .n { font-size: 11px; }
.spd.full .pin { top: -1px; bottom: -1px; width: 4px; margin-left: -2px; }
.spd .z b { font-size: 11px; font-weight: 700; line-height: 1; }
.spd .z { gap: 2px; display: flex; align-items: center; justify-content: center; }
.spd .z svg { width: 12px; height: 10px; }
.spr { display: flex; gap: 0; padding: 3px; position: relative; }
.spr .seg { flex: var(--n) 1 0; min-width: 28px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; border-radius: 4px; position: relative; }
.spr .seg + .seg { margin-left: 5px; }
.spr .seg + .seg::before { content: ""; position: absolute; left: -4px; top: -2px; bottom: -2px; width: 3px; border-radius: 2px; background: var(--mk); }
.spr .seg .r { font-family: 'Saira', sans-serif; font-stretch: 80%; font-weight: 600; font-size: 12px; line-height: 12px; color: oklch(from var(--gauge-ink) l c h / 85%); white-space: nowrap; }
.spr .seg .m { display: flex; align-items: center; gap: 2px; font-size: 11px; font-weight: 700; line-height: 11px; color: var(--gauge-ink); white-space: nowrap; }
.spr .seg .m svg { width: 12px; height: 10px; }
.spr .z1 { background: oklch(from var(--gauge-ink) l c h / 9%); }
.spr .z2 { background: oklch(from var(--gauge-ink) l c h / 18%); }
.spr .land { background: color-mix(in oklch, var(--led) 26%, transparent); }
.spr .land .m { color: var(--led); }
.spr .crash .m { color: var(--forbidden); }
.spr .seg.aim { background: var(--gauge-ink); }
.spr .seg.aim .r, .spr .seg.aim .m { color: var(--gauge); }
/* 4. turn masks */
.tm.w i.ok::after { border-top-color: oklch(0.56 0.17 145); opacity: 1; }
.tm.d { background: var(--gauge); box-shadow: 0 0 0 1px oklch(from var(--glow) l c h / 45%); }
.tm.d i.ok::after { border-top-color: var(--led); opacity: 1; }
/* 5. ability chips */
.chip.abw.used, .chip.abi.used { color: var(--muted-foreground); background: transparent; border-style: dashed; }
.chip.abw .st { font-size: 12px; font-weight: 600; display: inline-flex; align-items: center; gap: 2px; }
.chip.abw .st svg, .chip.abi .aw svg { width: 12px; height: 12px; color: currentColor; }
.chip.abi { padding: 0 8px 0 4px; }
.chip.abi .aw { width: 24px; height: 24px; border-radius: 6px; display: grid; place-items: center; background: var(--well); flex: none; }
.chip.abi .aw svg { width: 15px; height: 15px; color: var(--glow); }
.chip.abi.used .aw { background: transparent; box-shadow: inset 0 0 0 1.5px var(--border); }
.chip.abi.used .aw svg { width: 13px; height: 13px; color: var(--muted-foreground); }

/* the builder */
.lt, .dk { background: var(--background); color: var(--foreground); }
.dec { margin-top: 36px; }
.dec h3 { font-size: 18px; margin: 0 0 4px; }
.dec > p { margin: 0 0 4px; }
.opts { display: flex; flex-wrap: wrap; gap: 20px; margin-top: 12px; align-items: flex-start; }
.opt { width: 383px; max-width: 100%; display: flex; flex-direction: column; gap: 8px; padding: 8px; border-radius: 16px; box-shadow: inset 0 0 0 1px var(--border); cursor: pointer; }
.opt.chosen { box-shadow: inset 0 0 0 2px var(--ring); }
.opt .oh { display: flex; align-items: center; gap: 8px; padding: 2px 4px 0; }
.opt .oh b { font-size: 15px; }
.opt .rec { font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 10px; background: var(--primary); color: var(--primary-foreground); }
.opt .pk { margin-left: auto; font: inherit; font-size: 13px; font-weight: 600; height: 30px; padding: 0 12px; border-radius: 8px; border: 0; background: var(--secondary); color: var(--secondary-foreground); cursor: pointer; }
.opt.chosen .pk { background: var(--primary); color: var(--primary-foreground); }
.opt .why { margin: 0; padding: 0 4px; font-size: 13px; line-height: 18px; color: var(--muted-foreground); }
.ov { border-radius: 12px; padding: 8px; display: flex; flex-direction: column; gap: 10px; }
.ov .lbl { font-size: 12px; color: var(--muted-foreground); margin: 0 0 -4px; }
.slice { display: block; height: auto; padding: 0; width: 351px; max-width: 100%; }
.slice .crop { overflow: hidden; border-radius: 14px; }
.slice .crop.c2 { height: calc(var(--cell) * 2 + var(--gap) + 10px); }
.slice .mods { flex-wrap: nowrap; }
.closeup { zoom: 2.5; display: flex; gap: 4px; width: max-content; }
.closeup .apc { flex: none; width: 36px; height: 16px; justify-content: center; padding: 0; }
.picks { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.picks span { font-size: 13px; padding: 4px 10px; border-radius: 12px; background: var(--secondary); }
.picks span b { font-weight: 700; }
.doc details { margin-top: 48px; }
.doc summary { font-family: 'Saira', sans-serif; font-stretch: 112%; font-size: 22px; font-weight: 700; cursor: pointer; }
.frame.lt, .frame.dk { background: var(--background); }

/* ---------------- desktop (game screen frame ≥ 900 px) ---------------- */
.mods .abfull { display: none; }
@container (min-width: 900px) {
	.screen {
		--cell: 64px; --die: 68px; --gap: 8px; --tok: 26px;
		grid-template-columns: minmax(0, 1fr) 640px minmax(0, 1fr);
		grid-template-rows: 32px 1fr auto auto;
		grid-template-areas: "head head head" "track panel mods" "track hand mods" "track action mods";
		column-gap: 40px; row-gap: 14px; padding: 16px 32px 24px; max-width: 1280px; margin: 0 auto;
	}
	.track { flex-direction: row; gap: 8px; align-self: stretch; justify-self: end; }
	.ap { flex-direction: column-reverse; width: 150px; gap: 5px; }
	.apc { flex: 1; height: auto; min-height: 64px; }
	.apc .apt { inset: 4px 0 auto; }
	.alt { flex-direction: column-reverse; width: 92px; gap: 5px; }
	.alc { flex: 1; height: auto; font-size: 16px; }
	.alc .rtok { --rt: 22px; right: -5px; top: -6px; }
	.mods { flex-direction: column; align-self: start; max-width: 320px; gap: 10px; }
	.chip { height: 48px; padding: 0 12px; font-size: 15px; }
	.chip.grow { flex: none; }
	.mods .chip.abc { display: none; }
	.mods .abfull { display: block; }
	.mods .abcard .ban h2 { font-size: 17px; }
	.mods .abcard .face { padding: 10px 12px 12px; gap: 8px; }
	.mods .abcard .lead { font-size: 14px; line-height: 19px; font-weight: 500; }
	.mods .abcard ol { display: none; }
	.mods .abcard .dia { padding: 8px 6px 6px; }
	.mods .abcard .dia .die { --die: 34px; font-size: 19px; }
	.sp .v { font-size: 20px; line-height: 20px; }
	.sp svg { width: 22px; height: 22px; }
	.sp svg.att { width: 32px; height: 32px; }
	.pd { font-size: 30px; }
	.spd .n { font-size: 14px; font-stretch: 90%; }
	.axg i.cur svg, .axg.lit i.cur svg { width: 36px; height: 36px; }
	.axg.num i.cur svg { width: 32px; height: 26px; }
	.axg.num i b { font-size: 14px; line-height: 14px; }
	.spr .seg .r { font-size: 15px; line-height: 15px; }
	.spr .seg .m { font-size: 13px; }
	.hd { margin: 0; }
	.hand { padding: 8px 12px; }
}
</style>
</head>

<div id="app"></div>
<script>
// =================================================================== icons
const I = {

		placed: { axisPilot: ['P', 2], axisCopilot: ['C', 2], radioCopilot1: ['C', 6], enginesPilot: ['P', 1], flaps56: ['C', 5], conc1: ['P', 6], enginesCopilot: ['C', 2], conc2: ['C', 1] },
		hand: [null, null, null, null], partnerLeft: 0, phase: 'over', over: 'won'
	},
	lost: {
		scenario: 'HND', level: 'red', round: 6, N: 8, me: 'C', planes: [0, 0, 0, 0, 0, 1, 2, 1], traffic: [3, 0, 0, 1, 1, 1, 0, 0], turns: [null, 'xooxx', null, 'ooxxx', 'xooxx', null, 'ooxxx', null], pos: 6,
		axis: -1, blue: 7, orange: 11, brakes: 2, coffee: 2, rerolls: 0, fuel: 9, intern: { toks: [3, 5, 2, 6, 1, 4], gone: [0, 1, 4, 5] },
		abilities: [{ id: 'control', used: true }],
		placed: { internPilot: ['P', 1], gear56: ['I', 5], axisPilot: ['P', 3], axisCopilot: ['C', 3], flaps45: ['C', 4], enginesCopilot: ['C', 6], enginesPilot: ['P', 4] },
		sw: ['gear12', 'gear34', 'gear56', 'flaps12', 'flaps23', 'flaps45', 'brakes2', 'brakes4'],
		hand: [2, null, null, null], partnerLeft: 1, last: 'enginesPilot', phase: 'over', over: 'lost'
	}
};

function state(key) {
	return { ...structuredClone(BASE), ...structuredClone(S[key]), key };
}

// =================================================================== panel parts
function space(id, s) {
	const d = SP[id];
	const placed = s.placed[id];
	const cls = ['sp', d.c];
	if (placed) cls.push('has');
	if (s.legal.includes(id)) cls.push('legal');
	if (s.target === id) cls.push('target');
	if (s.last === id) cls.push('last');
	if (id.startsWith('ice') && s.ice && Number(id[3]) - 2 < s.ice.marker) cls.push('closed');
	if (id.startsWith('brakes') && s.sw.includes(id)) cls.push('closed');
	let inner;
	if (placed) {
		const [o, v] = placed;
		inner = `<div class="pd ${o}">${v}</div>`;
	} else if (d.icon) {
		inner = ic(d.icon, d.icon === 'att' ? 'att' : '');
	} else {
		inner = `<span class="v">${d.v}</span>`;
	}
	const on = s.sw.includes(id);
	const led = d.sw ? `<span class="led ${on ? 'on' : ''} ${id.startsWith('brakes') ? 'brk' : ''}">${on ? '✓' : s.round === 7 && !id.startsWith('brakes') ? '✕' : ''}</span>` : '';
	return `<div class="${cls.join(' ')}">${inner}${led}</div>`;
}

function axisGauge(s) {
	if (P.axis === 'dial') return axisDial(s);
	let h = '';
	for (let p = -3; p <= 3; p++) {
		if (Math.abs(p) === 3) { h += `<i class="end">${ic('cross', '')}</i>`; continue; }
		const side = p < 0 ? 'P' : p > 0 ? 'C' : 'zero';
		const cur = p === s.axis;
		const num = P.axis === 'num' ? `<b>${sign(p)}</b>` : '';
		h += `<i class="${side} ${cur ? 'cur' : ''}" ${cur ? `style="--tilt:${p * 16}deg"` : ''}>${cur ? ic('att', '') : ''}${num}</i>`;
	}
	return `<div class="gauge axg ${P.axis}" title="Axis ${sign(s.axis)}">${h}</div>`;
}

/* The dial: −2 … +2 on an arc 30° apart, the crosses at ±90°; the plane banks to the position and its fin is the needle. */
function axisDial(s) {
	const cx = 60, cy = 37, r = 33;
	const pt = (p, rr) => { const a = (p * 30 * Math.PI) / 180; return [(cx + Math.sin(a) * rr).toFixed(1), (cy - Math.cos(a) * rr).toFixed(1)]; };
	const land = s.round === 7;
	let ticks = '';
	for (let p = -2; p <= 2; p++) {
		const [x1, y1] = pt(p, p === 0 ? r - 9 : r - 6), [x2, y2] = pt(p, r);
		const col = p === s.axis ? 'var(--glow)' : land && p === 0 ? 'var(--led)' : 'oklch(from var(--gauge-ink) l c h / 65%)';
		ticks += `<path d="M${x1} ${y1}L${x2} ${y2}" stroke="${col}" stroke-width="${p === 0 || p === s.axis ? 3 : 2}" stroke-linecap="round"/>`;
	}
	const cross = (p) => { const [x, y] = pt(p, r - 3); return `<path d="M${x - 4} ${y - 4}l8 8m0-8l-8 8" stroke="var(--forbidden)" stroke-width="2.4" stroke-linecap="round"/>`; };
	const [lx, ly] = pt(-3, r), [tx, ty] = pt(0, r), [rx, ry] = pt(3, r);
	const sectors = `<path d="M${cx} ${cy}L${lx} ${ly}A${r} ${r} 0 0 1 ${tx} ${ty}z" fill="color-mix(in oklch, var(--pilot) 34%, transparent)"/>
		<path d="M${cx} ${cy}L${tx} ${ty}A${r} ${r} 0 0 1 ${rx} ${ry}z" fill="color-mix(in oklch, var(--copilot) 30%, transparent)"/>`;
	const plane = `<g transform="rotate(${s.axis * 30} ${cx} ${cy})"><path d="M${cx} ${cy - 6}V${cy - r + 4}" stroke="var(--glow)" stroke-width="2.4" stroke-linecap="round"/>
		<g transform="translate(${cx - 13.2} ${cy - 13.6}) scale(1.1)" fill="var(--gauge-ink)">${I.att.replace(/<\/?svg[^>]*>/g, '')}</g></g>`;
	return `<div class="gauge axg dial" title="Axis ${sign(s.axis)}"><svg viewBox="0 0 120 42" preserveAspectRatio="xMidYMid meet" aria-hidden="true">${sectors}${ticks}${cross(-3)}${cross(3)}${plane}</svg></div>`;
}

/** Highest final speed that lands: below the brake marker (or the ice-brake marker). */
function landMax(s) {
	if (s.ice) return s.ice.marker === 0 ? 1 : s.ice.marker + 1;
	return [1, 2, 4, 6][s.brakes ?? 0];
}

// What each band does, in words: the plane stays, moves one or two spaces; in the final round it lands or crashes.
const BAND = { z0: () => '<b>stay</b>', z1: () => '<b>+1</b>', z2: () => '<b>+2</b>', land: () => `${ic('ok', '')}<b>land</b>`, crash: () => ic('cross', '') };

function speedGauge(s) {
	const final = s.round === 7;
	const lm = landMax(s);
	const title = final ? `Lands at speed ${lm} or less` : `Speed: up to ${s.blue} stays, up to ${s.orange} one space, more two`;
	if (P.speed === 'ranges') {
		// The bands as segments, split by the markers; open-ended at both ends (wind can push the sum past 2 … 12).
		const segs = final
			? [{ z: 'land', lo: -Infinity, hi: lm, mk: '' }, { z: 'crash', lo: lm + 1, hi: Infinity, mk: 'var(--forbidden)' }]
			: [{ z: 'z0', lo: -Infinity, hi: s.blue, mk: '' }, { z: 'z1', lo: s.blue + 1, hi: s.orange, mk: 'var(--pilot)' }, { z: 'z2', lo: s.orange + 1, hi: Infinity, mk: 'var(--copilot)' }];
		const range = (g) => (g.lo === -Infinity ? `≤ ${g.hi}` : g.hi === Infinity ? `${g.lo}+` : g.lo === g.hi ? `${g.lo}` : `${g.lo}–${g.hi}`);
		const width = (g) => Math.max(1, Math.min(12, g.hi) - Math.max(2, g.lo) + 1);
		const html = segs.filter((g) => g.lo <= 12 || g.z === 'crash').map((g) => {
			const aim = s.speedAim !== null && s.speedAim >= g.lo && s.speedAim <= g.hi;
			return `<span class="seg ${g.z} ${aim ? 'aim' : ''}" style="--n:${width(g)};--mk:${g.mk}"><span class="r">${aim ? '= ' + s.speedAim : range(g)}</span><span class="m">${BAND[g.z]()}</span></span>`;
		}).join('');
		return `<div class="gauge spr" title="${title}">${html}</div>`;
	}
	const zone = (v) => (final ? (v <= lm ? 'land' : 'crash') : v <= s.blue ? 'z0' : v <= s.orange ? 'z1' : 'z2');
	let nums = '';
	// Every value numbered; a previewed sum is inverted.
	for (let v = 2; v <= 12; v++) nums += `<span class="n ${zone(v) === 'crash' ? '' : zone(v)} ${s.speedAim === v ? 'aim' : ''}">${v}</span>`;
	// the movement row: one span per band
	const bands = [];
	for (let v = 2; v <= 12; v++) {
		const z = zone(v);
		if (bands.length && bands[bands.length - 1].z === z) bands[bands.length - 1].n++;
		else bands.push({ z, n: 1 });
	}
	const row = bands.map((b) => `<span class="z ${b.z}" style="grid-column:span ${b.n}">${BAND[b.z]()}</span>`).join('');
	const pin = (k, c) => `<i class="pin ${c}" style="left:calc(2px + (100% - 4px) * ${Math.max(0, Math.min(11, k))} / 11)"></i>`;
	const pins = final ? pin(lm - 1, 'R') : pin(s.blue - 1, 'P') + pin(s.orange - 1, 'C');
	return `<div class="gauge spd full" title="${title}">${nums}${row}${pins}</div>`;
}

function brakeRows(s) {
	if (s.ice) {
		const cols = [2, 3, 4, 5];
		// The marker sits in a slot between the columns: before 2, after 2, …, past 5.
		const m = s.ice.marker;
		const x = m === 0 ? '4px' : m === 4 ? 'calc(100% - 4px)' : `calc(${m} * (var(--cell) + var(--gap)) - var(--gap) / 2)`;
		return `<div class="prow">${cols.map((c) => space('ice' + c + 't', s)).join('')}</div>
			<div class="icem" title="Ice-brake marker: must end past 5"><i style="left:${x}"></i></div>
			<div class="prow">${cols.map((c) => space('ice' + c + 'b', s)).join('')}</div>`;
	}
	const n = s.brakes ?? 0;
	const slot = (i) => `<span class="bslot ${i === n ? 'on' : ''}"></span>`;
	return `<div class="prow" title="Brakes: the final speed must be ${landMax(s)} or less">${slot(0)}${space('brakes2', s)}${slot(1)}${space('brakes4', s)}${slot(2)}${space('brakes6', s)}${slot(3)}</div>`;
}

function internBoard(s) {
	if (!s.intern) return '';
	const t = s.intern.toks;
	const live = t.map((_, i) => i).filter((i) => !s.intern.gone.includes(i));
	const left = live[0], right = live[live.length - 1];
	const toks = t.map((v, i) => `<span class="tok ${s.intern.gone.includes(i) ? 'gone' : ''} ${i === left ? 'nP' : ''} ${i === right ? 'nC' : ''}">${v}</span>`).join('');
	return `<div class="intern">${space('internPilot', s)}<div class="toks">${toks}</div>${space('internCopilot', s)}</div>`;
}

function panel(s) {
	const blue = ['radioPilot', 'gear12', 'gear34', 'gear56'];
	const orange = ['radioCopilot1', 'radioCopilot2', 'flaps12', 'flaps23', 'flaps45', 'flaps56'];
	return `<div class="panel ${s.sel !== null ? 'selecting' : ''} edge-${P.edge} me-${s.me}">
		<div class="pcol">${blue.map((id) => space(id, s)).join('')}${s.fuel !== undefined ? space('kerosene', s) : ''}</div>
		<div class="pmid">
			<div class="prow">${space('axisPilot', s)}${axisGauge(s)}${space('axisCopilot', s)}</div>
			<div class="prow">${space('enginesPilot', s)}${speedGauge(s)}${space('enginesCopilot', s)}</div>
			${brakeRows(s)}
			<div class="prow">${['conc1', 'conc2', 'conc3'].map((id) => space(id, s)).join('')}</div>
			${internBoard(s)}
		</div>
		<div class="pcol">${orange.map((id) => space(id, s)).join('')}</div>
	</div>`;
}

/** A turn mask: allowed axis positions −2 … +2 (o) and forbidden ones (x); the current position underlined. */
const turnMask = (t, axis) => `<div class="tm ${P.mask === 'dark' ? 'd' : 'w'}">${[...t].map((c, k) => `<i class="${c === 'x' ? 'x' : 'ok'} ${k - 2 === axis ? 'cur' : ''}"></i>`).join('')}</div>`;

function approach(s) {
	let h = '';
	for (let i = 0; i < s.N; i++) {
		const n = i + 1;
		const cls = ['apc'];
		if (n < s.pos) cls.push('past');
		if (n === s.pos) cls.push('here');
		if (s.aim === n) cls.push('aim');
		const t = s.turns[i];
		const tm = t ? turnMask(t, s.axis) : '<div class="tm none"></div>';
		const p = s.planes[i];
		const pl = `<div class="pl">${p > 2 ? ic('plane', '') + `<span class="n">×${p}</span>` : ic('plane', '').repeat(p)}</div>`;
		const tr = `<div class="trf">${'<i></i>'.repeat(n >= s.pos ? s.traffic[i] : 0)}</div>`;
		const apt = n === s.N ? `<span class="apt">${ic('tower', '')}</span>` : '';
		h += `<div class="${cls.join(' ')}" title="Space ${n}">${apt}${n === s.N ? '<div class="tm none"></div>' : tm}${pl}${tr}</div>`;
	}
	return `<div class="ap">${h}</div>`;
}

function altitude(s) {
	return `<div class="alt">${ALT.map((a, i) => {
		const r = i + 1;
		const fp = r % 2 ? 'P' : 'C';
		const tok = (s.rerollOn || []).includes(r) && r >= s.round ? rtok() : '';
		return `<div class="alc ${fp} ${r === s.round ? 'cur' : ''} ${r < s.round ? 'past' : ''}" title="${a === 'Land' ? 'Landing' : a.replace('k', '000') + ' ft'}, ${fp === 'P' ? 'Pilot' : 'Co-Pilot'} first"><span class="ar"></span>${a}${tok}</div>`;
	}).join('')}</div>`;
}

function header(s) {
	return `<div class="hd"><span class="hb" title="Home">${ic('house')}</span><span class="code mono">${s.code}</span><span class="dot" title="Connected"></span>
		<span class="sn ${s.level}" title="${s.scenario} ${s.level}">${s.scenario}</span>
		<span style="margin-left:auto" class="hb" title="Rules">${ic('book')}</span><span class="hb" title="Give up">${ic('flag')}</span>${themeToggle()}</div>`;
}

// =================================================================== abilities and modules
const ABIL = {
	adaptation: {
		name: 'Adaptation', short: 'Adapt', icon: 'flip', when: 'Once per game each',
		line: 'Flip one die to its opposite face.',
		lead: 'Each of you may once per game turn one of your unplaced dice to its opposite face.',
		steps: ['Opposite faces add up to 7: 1 and 6, 2 and 5, 3 and 4.', 'You can do it at any time during placement, also on your partner’s turn.'],
		dia: () => `<figure><span class="die P">1</span>before</figure><span class="arw">→</span><figure><span class="die P">6</span>after</figure>`
	},
	anticipation: {
		name: 'Anticipation', short: 'Anticipate', icon: 'reroll', when: 'Once per round',
		line: 'The first player rerolls one die before placing.',
		lead: 'Before the first die of a round is placed, the round’s first player may reroll one of their dice.',
		steps: ['The altitude track’s arrow shows who goes first.', 'The app offers it before your first placement; skip it if you like your dice.'],
		dia: () => `<figure><span class="die C">1</span>before</figure><span class="arw">${ic('reroll')}</span><figure><span class="die C hid"></span>rerolled</figure>`
	},
	control: {
		name: 'Control', short: 'Control', icon: 'coffee', when: 'Every round',
		line: 'Equal axis dice give a coffee.',
		lead: 'When both axis spaces hold the same value, you gain a coffee at once.',
		steps: ['Only if fewer than 3 coffees are on the panel.', 'Intern tokens and the black die count as dice.'],
		dia: () => `<figure><span class="die P">4</span>axis</figure><span class="arw">=</span><figure><span class="die C">4</span>axis</figure><span class="arw">→</span><figure><span class="slot">${ic('coffee')}</span>coffee</figure>`
	},
	mastery: {
		name: 'Mastery', short: 'Mastery', icon: 'pair', when: 'Every round',
		line: 'Equal engine dice give a reroll token.',
		lead: 'When both engine spaces hold the same value, you gain a reroll token at once.',
		steps: ['Only 2 tokens exist: you gain one only if it is neither on the altitude track nor in your supply.', 'Intern tokens and the black die count as dice.'],
		dia: () => `<figure><span class="die P">2</span>engines</figure><span class="arw">=</span><figure><span class="die C">2</span>engines</figure><span class="arw">→</span><figure>${rtok()}token</figure>`
	},
	synchronisation: {
		name: 'Synchronisation', short: 'Sync', icon: 'blackDie', when: 'Once per round',
		line: 'Gear and flaps in one round: the black die joins in.',
		lead: 'As soon as a round has a die on the landing gear and one on the flaps, the black die is rolled.',
		steps: ['The Co-Pilot places it at once on any empty space it fits, of either colour.', 'It acts like a normal die and is an extra action.', 'No coffee on it, and it can’t go on an intern space.'],
		dia: () => `<figure><span class="die P">3</span>gear</figure><span class="arw">+</span><figure><span class="die C">2</span>flaps</figure><span class="arw">→</span><figure><span class="die T">5</span>black die</figure>`
	},
	workingTogether: {
		name: 'Working Together', short: 'Together', icon: 'swap', when: 'Once per round',
		line: 'Swap the values of one die each.',
		lead: 'Trade one die’s value with your partner, without naming a number.',
		steps: [
			'At any time during placement, one of you puts an unplaced die on the card. Its value is open: you both see it.',
			'The partner must answer with one of their unplaced dice, if they have one left. That one stays hidden.',
			'The two dice swap values and go back to their owners.'
		],
		dia: () => `<figure><span class="die P">5</span>open</figure><span class="arw">⇄</span><figure><span class="die C hid"></span>hidden</figure>`
	}
};
const MODS = {
	fuel: { name: 'Kerosene' }, wind: { name: 'Wind' }, ice: { name: 'Ice brakes' }, intern: { name: 'Intern' }, leak: { name: 'Kerosene leak' }
};

function abCard(id, foot) {
	const a = ABIL[id];
	return `<div class="abcard"><div class="ban"><h2>${a.name}</h2><span class="when">${a.when}</span></div>
		<div class="face"><p class="lead">${a.lead}</p><div class="dia">${a.dia()}</div><ol>${a.steps.map((t) => `<li>${t}</li>`).join('')}</ol></div></div>${foot ?? ''}`;
}

/* The wind ring: 20 spaces, the value from the space's distance to the top (rules §12.3). */
function windRing(off) {
	const V = [3, 3, 2, 2, 1, 0, -1, -2, -2, -3, -3];
	let segs = '';
	for (let p = 0; p < 20; p++) {
		const v = V[Math.min(p, 20 - p)];
		const a = ((p * 18 - 90) * Math.PI) / 180;
		const x = 88 + 70 * Math.cos(a), y = 88 + 70 * Math.sin(a);
		const cur = ((off % 20) + 20) % 20 === p;
		segs += `<g>${cur ? `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="12" fill="var(--glow)"/>` : ''}<text x="${x.toFixed(1)}" y="${(y + 4.5).toFixed(1)}" text-anchor="middle" font-size="13" font-weight="700" font-family="Saira" fill="${cur ? 'var(--well)' : 'var(--gauge-ink)'}">${sign(v)}</text></g>`;
	}
	const rot = (((off % 20) + 20) % 20) * 18;
	return `<svg viewBox="0 0 176 176"><circle cx="88" cy="88" r="84" fill="var(--gauge)"/><circle cx="88" cy="88" r="56" fill="var(--well)"/>${segs}
		<g transform="rotate(${rot} 88 88)"><path d="M88 36v18" stroke="var(--glow)" stroke-width="3" stroke-linecap="round"/><g transform="translate(70 70) scale(1.5)" fill="var(--plane)">${I.plane.replace(/<\/?svg[^>]*>/g, '')}</g></g></svg>`;
}

function moduleSheet() {
	return `<div class="scrim"></div><div class="sheet mcard"><div class="grab"></div>
		<div class="ban"><span class="mi">${ic('wind')}</span><h2>Wind</h2></div>
		<p style="color:var(--foreground);font-weight:600">The wind adds to your speed, and the axis turns it.</p>
		<div class="wring">${windRing(-3)}</div>
		<ul><li>The plane on the ring starts at the top, on +3.</li>
		<li>After the axis resolves each round, the plane turns by the axis position: toward the Pilot counter-clockwise, toward the Co-Pilot clockwise. A level axis leaves it.</li>
		<li>The value it points at adds to the engine sum, every round including the landing.</li></ul>
		<div class="row"><span class="btn out">Close</span></div></div>`;
}

// =================================================================== table
function mods(s) {
	let h = '';
	if (s.fuel !== undefined) h += `<div class="chip grow" title="Kerosene">${ic('fuel')}<span class="fbar"><i style="left:${(s.fuel / 20) * 100}%"></i></span><b>${s.fuel}</b></div>`;
	if (s.wind) h += `<div class="chip" title="Wind"><span class="ring" style="--rot:${s.wind.off * 18}deg"></span><b>${sign(s.wind.v)}</b></div>`;
	for (const a of s.abilities) {
		const t = `title="${ABIL[a.id].name}${a.used ? ', used this round' : ', ready'}"`;
		if (P.abil === 'word') h += `<div class="chip abc abw ${a.used ? 'used' : ''}" ${t}>${ABIL[a.id].short}${a.used ? `<span class="st">${ic('check', '')}used</span>` : ''}</div>`;
		else h += `<div class="chip abc abi ${a.used ? 'used' : ''}" ${t}><span class="aw">${ic(a.used ? 'check' : ABIL[a.id].icon, '')}</span>${ABIL[a.id].short}</div>`;
	}
	// Desktop shows the ability cards themselves in the right column.
	for (const a of s.abilities) h += `<div class="abfull">${abCard(a.id)}</div>`;
	// The base game has no modules or abilities: the row is left out (its height goes to the panel).
	return h ? `<div class="mods">${h}</div>` : '';
}

function cups(n) { return `<span class="cups">${[0, 1, 2].map((i) => `<i class="${i < n ? 'f' : ''}"></i>`).join('')}</span>`; }

function hand(s) {
	const me = s.me, pt = me === 'P' ? 'C' : 'P', P = NAMES[pt];
	const pc = pt === 'P' ? 'var(--pilot)' : 'var(--copilot)';
	const fd = `<span class="fd" style="--pc:${pc}" title="${P} has ${s.partnerLeft} dice left">${[0, 1, 2, 3].map((i) => `<i class="${i < s.partnerLeft ? '' : 'out'}"></i>`).join('')}</span>`;
	if (s.phase === 'discussion') {
		// Before the roll the tray holds the round-start news and the one reminder about talking.
		const got = s.pickup ? `<span class="got">${rtok()}Reroll token picked up</span>` : '';
		return `<div class="hand"><div class="talk"><b>Talk strategy, not dice</b><span>${(s.round % 2 ? 'P' : 'C') === me ? 'You place' : P + ' places'} first this round.</span>${got}</div>
			<div class="who"><b>${P}</b>${s.partnerReady ? 'is ready' : 'is talking'}</div></div>`;
	}
	const dice = s.hand.map((v, i) => {
		if (v === null) return `<span class="die empty"></span>`;
		const cls = ['die', me];
		if (i === s.sel) cls.push('sel');
		if (s.rr && s.rr.includes(v)) cls.push('rr');
		if (s.phase === 'waiting') cls.push('locked');
		const shown = i === s.sel && s.mod ? v + s.mod : v;
		const mod = i === s.sel && s.mod ? `<span class="mod">${sign(s.mod)}</span>` : '';
		const rri = s.rr && s.rr.includes(v) ? rtok() : '';
		return `<span class="${cls.join(' ')}">${shown}${mod}${rri}</span>`;
	}).join('');
	let who;
	if (s.phase === 'turn') who = `<b>Your turn</b>${fd}`;
	else if (s.phase === 'waiting') who = `<b>${P}’s turn</b>${fd}`;
	else if (s.phase === 'reroll') who = `<b>Reroll</b><span>Tap dice to roll again</span>`;
	else who = `<b>${P}</b>${fd}`;
	return `<div class="hand ${s.phase === 'turn' ? 'mine' : ''}">${dice}<div class="who">${who}</div></div>`;
}

function action(s) {
	const n = s.rerolls;
	const rr = `<span class="btn rrb ${n ? '' : 'dis'}" title="${n ? `Spend a reroll token (${n} in the supply)` : 'No reroll token in the supply'}">${rtok(n ? '' : 'gone')}<b>${n}</b></span>`;
	const P = NAMES[s.me === 'P' ? 'C' : 'P'];
	if (s.phase === 'reroll') return `<div class="action"><span class="btn out">Keep all</span><span class="btn pri">Reroll 1 die</span></div>`;
	if (s.phase === 'discussion') return `<div class="action"><span class="btn pri">Ready</span>${rr}</div>`;
	const left = s.coffee - Math.abs(s.mod || 0);
	const on = s.phase === 'turn';
	const place = on ? `<span class="btn pri">Place</span>` : `<span class="btn wait">Waiting for ${P}</span>`;
	return `<div class="action"><div class="stepper"><span class="btn ${on ? '' : 'dis'}">−</span><span class="val">${left}${cups(left)}</span><span class="btn ${on ? '' : 'dis'}">+</span></div>${place}${rr}</div>`;
}
