<style>
/*
 * Cockpit panel: a brushed-aluminium panel with navy instrument wells, Pilot spaces in deep blue
 * with ice-blue numerals, Co-Pilot spaces in brick with backlit yellow numerals, black gauge strips,
 * green switch LEDs. Dice are the bold part: blue with white numerals, orange with dark numerals,
 * as the physical dice. By night the aluminium turns gunmetal and the glows carry the panel.
 * Token names follow the future sky-team/frontend/src/routes/layout.css.
 */
:root {
	--background: oklch(0.935 0.012 240);
	--foreground: oklch(0.24 0.035 258);
	--card: oklch(0.982 0.005 240);
	--card-foreground: var(--foreground);
	--popover: var(--card);
	--popover-foreground: var(--foreground);
	--primary: oklch(0.34 0.1 262);
	--primary-foreground: oklch(0.975 0.008 240);
	--secondary: oklch(0.895 0.016 240);
	--secondary-foreground: var(--foreground);
	--muted: oklch(0.895 0.016 240);
	--muted-foreground: oklch(0.45 0.03 252);
	--accent: oklch(0.9 0.02 240);
	--accent-foreground: var(--foreground);
	--destructive: oklch(0.54 0.2 27);
	--border: oklch(0.3 0.04 255 / 17%);
	--input: oklch(0.3 0.04 255 / 20%);
	--ring: oklch(0.34 0.1 262);
	--radius: 0.6rem;

	/* Panel: brushed aluminium, its darker column strips, the hazard-yellow edge marks. */
	--panel: oklch(0.835 0.02 238);
	--panel-strip: oklch(0.765 0.022 240);
	--hazard: oklch(0.84 0.16 92);
	/* Instrument wells: navy, with the cyan glow of their frames and labels. */
	--well: oklch(0.29 0.075 262);
	--glow: oklch(0.84 0.1 222);
	/* Pilot: die body and numeral, space and its label. */
	--pilot: oklch(0.56 0.155 256);
	--pilot-ink: oklch(0.985 0.005 250);
	--pilot-well: oklch(0.31 0.115 263);
	--pilot-glow: oklch(0.85 0.09 232);
	/* Co-Pilot: die body and numeral (dark, as the physical dice), space and its backlit label. */
	--copilot: oklch(0.73 0.165 55);
	--copilot-ink: oklch(0.2 0.03 45);
	--copilot-well: oklch(0.43 0.135 33);
	--copilot-glow: oklch(0.9 0.14 90);
	/* Gauge strips (axis, speed, ice marker): black with white numbers, red crosses. */
	--gauge: oklch(0.21 0.012 255);
	--gauge-ink: oklch(0.96 0.005 250);
	--forbidden: oklch(0.6 0.21 27);
	/* Switch LEDs: lit green when deployed, dark when not. */
	--led: oklch(0.76 0.2 142);
	--led-off: oklch(0.36 0.02 250);
	/* Pieces: traffic die, intern token (its own green piece), plane tokens. */
	--traffic: oklch(0.17 0.005 255);
	--intern: oklch(0.52 0.11 165);
	--plane: oklch(0.985 0.003 240);
	/* Attitude indicator (start-page art, game over): sky and earth. */
	--sky: oklch(0.72 0.11 232);
	--earth: oklch(0.56 0.085 62);
	/* Kerosene gauge: full green to empty red, as on the track. */
	--fuel-full: oklch(0.72 0.17 145);
	--fuel-empty: oklch(0.6 0.2 30);
	/* Scenario colours (difficulty): green, yellow, red, black, with the ink on them. */
	--level-green: oklch(0.78 0.17 128);
	--level-yellow: oklch(0.84 0.16 88);
	--level-red: oklch(0.6 0.2 30);
	--level-black: oklch(0.25 0.01 255);
	--online: oklch(0.62 0.16 150);
	--new-card: oklch(0.6 0.14 210);
	--shade: oklch(0.2 0.03 258 / 40%);
	color-scheme: light;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
	background: var(--background);
	color: var(--foreground);
	font-family: 'IBM Plex Sans', system-ui, sans-serif;
	font-size: 16px;
	line-height: 1.5;
	-webkit-font-smoothing: antialiased;
}
.display { font-family: 'Saira', 'IBM Plex Sans', sans-serif; font-stretch: 112%; }
.mono { font-family: ui-monospace, 'Cascadia Mono', Consolas, monospace; }
svg.i { width: 16px; height: 16px; flex: none; }

/* ---------------- plan document ---------------- */
.doc { max-width: 1240px; margin: 0 auto; padding: 32px 16px 64px; }
.doc h1 { font-family: 'Saira', sans-serif; font-stretch: 112%; font-size: 32px; line-height: 1.15; margin: 0 0 8px; font-weight: 700; }
.doc h2 { font-family: 'Saira', sans-serif; font-stretch: 112%; font-size: 22px; margin: 48px 0 8px; font-weight: 700; }
.doc h3 { font-size: 16px; margin: 20px 0 6px; }
.doc p, .doc li { max-width: 74ch; }
.doc .lede { color: var(--muted-foreground); }
.doc table { border-collapse: collapse; font-size: 14px; margin: 8px 0 16px; display: block; overflow-x: auto; max-width: 100%; }
.doc th, .doc td { border-bottom: 1px solid var(--border); padding: 6px 12px 6px 0; text-align: left; vertical-align: top; }
.doc th { color: var(--muted-foreground); font-weight: 600; }
.sw { display: inline-block; width: 28px; height: 28px; border-radius: 6px; vertical-align: middle; border: 1px solid var(--border); }
.gallery { display: flex; flex-wrap: wrap; gap: 24px 20px; margin-top: 16px; align-items: flex-start; }
.shot { display: flex; flex-direction: column; gap: 6px; max-width: 100%; margin: 0; }
.shot figcaption { font-size: 13px; color: var(--muted-foreground); max-width: 375px; }
.frame {
	width: var(--fw, 375px); height: var(--fh, 812px);
	container-type: size; overflow: hidden; position: relative;
	background: var(--background); color: var(--foreground);
	border: 1px solid var(--border); border-radius: 22px;
}
.frame.scroll { overflow-y: auto; scrollbar-width: none; }
.solo .frame { border: 0; border-radius: 0; }
.dies { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

/* ---------------- game screen ---------------- */
.screen {
	--g: 12px;
	--cell: 42px;
	--die: 50px;
	--gap: 4px;
	--tok: 20px;
	height: 100%;
	display: grid;
	grid-template-columns: minmax(0, 1fr);
	grid-template-rows: auto auto auto 1fr auto auto auto;
	grid-template-areas: "head" "track" "mods" "panel" "status" "hand" "action";
	gap: 6px;
	padding: 12px var(--g) max(12px, env(safe-area-inset-bottom));
	font-size: 14px; line-height: 1.25;
	font-variant-numeric: tabular-nums;
	position: relative;
}
@container (min-height: 740px) {
	.screen { --cell: 48px; --die: 56px; --gap: 5px; gap: 12px; }
}

/* header row: 32 px, as the shared headerRow */
.hd { grid-area: head; display: flex; align-items: center; gap: 6px; height: 32px; margin: -4px -8px 0; padding: 0 0 0 8px; white-space: nowrap; font-size: 14px; }
.hd .code { font-weight: 600; letter-spacing: .15em; font-size: 16px; }
.hd .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--online); }
.hd .rnd { color: var(--muted-foreground); }
.hd .rnd b { color: var(--foreground); font-weight: 700; }
.hb { width: 32px; height: 32px; display: grid; place-items: center; color: var(--muted-foreground); border-radius: 8px; }
.lvl { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 7px 0 6px; border-radius: 6px; font-size: 12px; font-weight: 700; font-family: 'Saira', sans-serif; font-stretch: 112%; color: var(--gauge-ink); background: var(--well); }
.lvl::before { content: ""; width: 4px; height: 12px; border-radius: 2px; background: var(--c); }
.lvl.green { --c: var(--level-green); } .lvl.yellow { --c: var(--level-yellow); } .lvl.red { --c: var(--level-red); } .lvl.black { --c: oklch(0.9 0 0); }

/* approach + altitude */
.track { grid-area: track; display: flex; flex-direction: column; gap: 3px; }
.ap { display: flex; gap: 3px; }
.apc {
	flex: 1; min-width: 0; height: 46px; border-radius: 6px; position: relative;
	background: radial-gradient(120% 90% at 50% 100%, oklch(0.42 0.12 250), var(--well) 70%);
	display: flex; flex-direction: column; align-items: center; justify-content: space-between;
	padding: 3px 1px 4px; color: var(--plane);
}
.apc.past { opacity: .35; }
.apc.here { box-shadow: 0 0 0 2px var(--glow); }
.apc.here::before { content: ""; position: absolute; top: -6px; left: 50%; translate: -50% 0; border: 6px solid transparent; border-top-color: var(--hazard); border-bottom: 0; filter: drop-shadow(0 1px 0 var(--well)); }
.apc.aim { box-shadow: 0 0 0 2px var(--background), 0 0 0 4px var(--ring); }
.apc.here.aim { box-shadow: 0 0 0 2px var(--glow), 0 0 0 4px var(--ring); }
.apc .apt { position: absolute; inset: 3px 0 auto; text-align: center; font-size: 12px; font-weight: 700; line-height: 13px; color: var(--glow); }
.apc .apt svg { display: block; margin: 0 auto; width: 20px; height: 12px; }
.tm { display: flex; gap: 1px; height: 10px; padding: 1px 2px; border-radius: 3px; background: var(--plane); }
.tm i { width: 6px; height: 8px; position: relative; }
.tm i.ok::after { content: ""; position: absolute; left: 0; top: 1px; border: 3px solid transparent; border-top: 5px solid var(--gauge); border-bottom: 0; opacity: .55; }
.tm i.x::before, .tm i.x::after { content: ""; position: absolute; left: 2.5px; top: 0; width: 1.6px; height: 8px; background: var(--forbidden); rotate: 40deg; }
.tm i.x::after { rotate: -40deg; }
.tm i.cur { box-shadow: 0 2px 0 0 var(--hazard); }
.tm.none { visibility: hidden; }
.pl { display: flex; gap: 0; height: 14px; align-items: center; }
.pl svg { width: 13px; height: 13px; fill: var(--plane); }
.pl .n { font-size: 12px; font-weight: 700; margin-left: 1px; }
.trf { display: flex; gap: 1px; height: 9px; }
.trf i { width: 9px; height: 9px; border-radius: 2px; background: var(--plane); position: relative; }
.trf i::after { content: ""; position: absolute; inset: 3px; border-radius: 50%; background: var(--traffic); }
.alt { display: flex; gap: 3px; }
.alc { flex: 1; height: 20px; border-radius: 4px; background: var(--well); color: var(--gauge-ink); font-size: 12px; font-family: 'Saira', sans-serif; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 2px; box-shadow: inset 0 0 0 1px var(--fp); opacity: .9; }
.alc.P { --fp: var(--pilot-glow); }
.alc.C { --fp: var(--copilot-glow); }
.alc .ar { color: var(--fp); font-size: 11px; }
.alc.cur { box-shadow: inset 0 0 0 2px var(--fp); background: oklch(from var(--well) calc(l + .08) c h); opacity: 1; }
.alc.past { opacity: .4; }
.alc svg { width: 11px; height: 11px; color: var(--glow); }

/* chips: modules, abilities, landing checks */
.mods { grid-area: mods; display: flex; gap: 4px; }
.chip { height: 34px; border-radius: 8px; background: var(--card); border: 1px solid var(--border); display: flex; align-items: center; gap: 5px; padding: 0 7px; font-size: 13px; white-space: nowrap; flex: none; min-width: 0; }
.chip b { font-weight: 700; }
.chip.grow { flex: 1 1 0; }
.chip svg { color: var(--muted-foreground); }
.fbar { flex: 1; height: 8px; border-radius: 4px; background: linear-gradient(90deg, var(--fuel-empty), var(--hazard) 45%, var(--fuel-full)); position: relative; min-width: 34px; }
.fbar i { position: absolute; top: -3px; bottom: -3px; width: 3px; border-radius: 2px; background: var(--foreground); box-shadow: 0 0 0 1.5px var(--card); }
.ring { width: 20px; height: 20px; border-radius: 50%; border: 3px solid var(--panel-strip); position: relative; flex: none; }
.ring::after { content: ""; position: absolute; left: 50%; top: -1px; width: 2px; height: 9px; border-radius: 1px; background: var(--pilot); transform-origin: 50% 8px; transform: translateX(-50%) rotate(var(--rot)); }
.chip .ab-dot { width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--foreground); flex: none; }
.chip .ab-dot.used { background: var(--foreground); }
.chip .abt { display: none; }
.chip.ok { border-color: color-mix(in oklch, var(--led) 60%, transparent); }
.chip .chk { width: 16px; height: 16px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 800; flex: none; }
.chip.ok .chk { background: var(--led); color: oklch(0.2 0.05 145); }
.chip.open .chk { border: 2px solid var(--muted-foreground); }

/* panel */
.pwrap { grid-area: panel; display: flex; align-items: center; justify-content: center; min-height: 0; }
.panel {
	display: flex; gap: 6px; align-items: stretch; justify-content: center; width: 100%;
	padding: 5px; border-radius: 14px;
	background:
		repeating-linear-gradient(90deg, oklch(1 0 0 / 3%) 0 1px, transparent 1px 3px),
		var(--panel);
	box-shadow: inset 0 1px 0 oklch(1 0 0 / 22%), 0 1px 2px var(--shade);
	position: relative;
}
.panel::before, .panel::after { content: ""; position: absolute; width: 3px; height: 34px; border-radius: 2px; background: var(--hazard); top: 50%; }
.panel::before { left: -1px; } .panel::after { right: -1px; }
.pcol { display: flex; flex-direction: column; gap: var(--gap); padding: 3px; margin: -3px; border-radius: 10px; background: var(--panel-strip); }
.pmid { display: flex; flex-direction: column; gap: var(--gap); flex: 1 1 auto; min-width: 0; justify-content: flex-start; }
.prow { display: flex; gap: var(--gap); align-items: center; justify-content: center; }
.sp {
	width: var(--cell); height: var(--cell); flex: none; border-radius: 9px; position: relative;
	display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
	box-shadow: inset 0 2px 4px oklch(0 0 0 / 35%), inset 0 0 0 1px oklch(1 0 0 / 8%);
	color: var(--lab);
	font-size: 12px; line-height: 13px;
}
.sp.b { background: var(--pilot-well); --lab: var(--pilot-glow); }
.sp.o { background: var(--copilot-well); --lab: var(--copilot-glow); }
.sp.x { background: linear-gradient(135deg, var(--pilot-well) 50%, var(--copilot-well) 50%); --lab: var(--gauge-ink); }
.sp .v { font-family: 'Saira', sans-serif; font-stretch: 105%; font-weight: 700; font-size: 16px; line-height: 16px; text-shadow: 0 0 6px color-mix(in oklch, var(--lab) 45%, transparent); }
.sp .w { font-size: 12px; line-height: 12px; opacity: .85; }
.sp svg { width: 18px; height: 18px; filter: drop-shadow(0 0 3px color-mix(in oklch, var(--lab) 40%, transparent)); }
.led { position: absolute; right: -3px; bottom: -3px; width: 14px; height: 14px; border-radius: 50%; background: var(--led-off); box-shadow: 0 0 0 2px var(--panel-strip); display: grid; place-items: center; font-size: 9px; font-weight: 900; color: transparent; }
.led.on { background: var(--led); color: oklch(0.22 0.06 145); box-shadow: 0 0 0 2px var(--panel-strip), 0 0 6px var(--led); }
.sp.closed { opacity: .4; }
.sp.closed .v { text-decoration: line-through; }
/* dice and pieces on the panel */
.pd { position: absolute; inset: 2px; border-radius: 8px; display: grid; place-items: center; font-family: 'Saira', sans-serif; font-stretch: 105%; font-weight: 700; font-size: 22px; line-height: 1; }
.pd.P { background: linear-gradient(150deg, oklch(from var(--pilot) calc(l + .08) c h), var(--pilot) 60%); color: var(--pilot-ink); box-shadow: inset 0 -2px 0 oklch(0 0 0 / 20%), inset 0 0 0 1px oklch(1 0 0 / 30%); }
.pd.C { background: linear-gradient(150deg, oklch(from var(--copilot) calc(l + .07) c h), var(--copilot) 60%); color: var(--copilot-ink); box-shadow: inset 0 -2px 0 oklch(0 0 0 / 18%); }
.pd.T { background: linear-gradient(150deg, oklch(0.32 0.01 255), var(--traffic) 60%); color: var(--plane); box-shadow: inset 0 -2px 0 oklch(0 0 0 / 40%); }
.pd.I { inset: 4px; border-radius: 50%; background: var(--intern); color: oklch(0.99 0 0); box-shadow: 0 0 0 2px oklch(1 0 0 / 70%); font-size: 18px; }
.sp.last .pd { box-shadow: 0 0 0 2px var(--panel), 0 0 0 4px var(--new-card); }
.sp.last::after { content: ""; position: absolute; top: -4px; left: -4px; width: 9px; height: 9px; border-radius: 50%; background: var(--new-card); box-shadow: 0 0 0 2px var(--panel); z-index: 2; }
/* selection */
.selecting .sp:not(.legal):not(.has) { opacity: .42; }
.selecting .sp.has:not(.target) { opacity: .9; }
.sp.legal { outline: 2px solid var(--ring); outline-offset: 1px; }
.sp.target { outline: 3px solid var(--ring); outline-offset: 2px; }
.sp.target::before { content: ""; position: absolute; inset: 5px; border-radius: 6px; border: 2px dashed var(--lab); opacity: .9; }

/* gauges inside the panel */
.gauge { flex: 1; display: flex; gap: 2px; padding: 3px; border-radius: 8px; background: var(--gauge); color: var(--gauge-ink); height: var(--cell); align-items: stretch; min-width: 0; }
.axg i { flex: 1; border-radius: 4px; display: grid; place-items: center; font-style: normal; font-size: 12px; font-family: 'Saira', sans-serif; font-weight: 700; color: oklch(from var(--gauge-ink) l c h / 40%); }
.axg i.end { color: var(--forbidden); font-size: 14px; }
.axg i.cur { background: var(--gauge-ink); color: var(--gauge); font-size: 14px; }
.axg i.zero { box-shadow: inset 0 0 0 1px oklch(from var(--gauge-ink) l c h / 25%); }
.spd { position: relative; }
.spd div { flex: 1; border-radius: 4px; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 13px; }
.spd div b { font-family: 'Saira', sans-serif; font-weight: 700; font-size: 14px; line-height: 15px; }
.spd div span { font-size: 12px; opacity: .75; }
.spd .mk { flex: none; width: 3px; border-radius: 2px; }
.spd .mk.P { background: var(--pilot); box-shadow: 0 0 0 1px var(--pilot-glow); }
.spd .mk.C { background: var(--copilot); }
.spd .land b { color: var(--copilot-glow); }
.rd { font-size: 12px; line-height: 13px; text-align: center; color: var(--foreground); min-width: 38px; }
.rd b { display: block; font-family: 'Saira', sans-serif; font-weight: 700; font-size: 15px; line-height: 16px; }
.rd .mkr { display: block; width: 10px; height: 10px; margin: 0 auto 2px; border-radius: 2px; background: var(--forbidden); }
.arrow { color: var(--foreground); opacity: .5; font-size: 10px; }
.icem { align-self: center; position: relative; width: calc(var(--cell) * 4 + var(--gap) * 3); height: 12px; border-radius: 6px; background: var(--gauge); }
.icem i { position: absolute; top: -3px; width: 8px; height: 18px; margin-left: -4px; border-radius: 3px; background: var(--forbidden); box-shadow: 0 0 0 2px var(--panel); }
.icem b { position: absolute; top: 0; width: var(--cell); text-align: center; font-size: 10px; line-height: 12px; color: oklch(from var(--gauge-ink) l c h / 55%); font-weight: 700; }
.intern { display: flex; align-items: center; gap: 6px; justify-content: center; }
.toks { display: flex; gap: 2px; padding: 3px; border-radius: 12px; background: var(--panel-strip); }
.tok { width: var(--tok); height: var(--tok); border-radius: 50%; background: var(--intern); color: oklch(0.99 0 0); font-size: 12px; font-weight: 700; font-family: 'Saira', sans-serif; display: grid; place-items: center; }
.tok.gone { background: transparent; box-shadow: inset 0 0 0 1.5px oklch(from var(--foreground) l c h / 25%); color: transparent; }
.tok.nP { box-shadow: 0 0 0 2px var(--pilot); }
.tok.nC { box-shadow: 0 0 0 2px var(--copilot); }

/* status, hand, action */
.status { grid-area: status; min-height: 30px; display: flex; align-items: center; gap: 8px; font-size: 14px; line-height: 17px; }
.pill { flex: none; height: 24px; padding: 0 10px; border-radius: 12px; display: inline-flex; align-items: center; font-weight: 600; font-size: 13px; background: var(--primary); color: var(--primary-foreground); }
.pill.wait { background: var(--muted); color: var(--foreground); }
.hand { grid-area: hand; display: flex; align-items: center; gap: 7px; padding: 7px; border-radius: 14px; background: var(--card); border: 1px solid var(--border); position: relative; }
.hand.mine { box-shadow: 0 0 0 2px var(--ring); border-color: transparent; }
.hand .tab { position: absolute; left: 0; top: 6px; bottom: 6px; width: 3px; border-radius: 0 3px 3px 0; background: var(--me); }
.die { width: var(--die); height: var(--die); border-radius: 11px; flex: none; display: grid; place-items: center; font-family: 'Saira', sans-serif; font-stretch: 105%; font-weight: 700; font-size: 27px; line-height: 1; position: relative; }
.die.P { background: linear-gradient(150deg, oklch(from var(--pilot) calc(l + .09) c h), var(--pilot) 55%); color: var(--pilot-ink); box-shadow: inset 0 -3px 0 oklch(0 0 0 / 22%), 0 1px 2px var(--shade); }
.die.C { background: linear-gradient(150deg, oklch(from var(--copilot) calc(l + .07) c h), var(--copilot) 55%); color: var(--copilot-ink); box-shadow: inset 0 -3px 0 oklch(0 0 0 / 18%), inset 0 0 0 1px oklch(0.45 0.12 45 / 55%), 0 1px 2px var(--shade); }
.die.T { background: linear-gradient(150deg, oklch(0.34 0.01 255), var(--traffic) 55%); color: var(--plane); }
.die.empty { background: transparent; box-shadow: inset 0 0 0 1.5px var(--border); }
.die.blank { color: transparent; opacity: .45; }
.die.sel { translate: 0 -4px; box-shadow: 0 0 0 2px var(--card), 0 0 0 4px var(--ring), 0 6px 10px var(--shade); }
.die .mod { position: absolute; right: -7px; top: -9px; height: 18px; padding: 0 5px; border-radius: 9px; font-family: 'IBM Plex Sans', sans-serif; font-size: 12px; font-weight: 700; line-height: 18px; background: var(--foreground); color: var(--background); }
.die.rr::after { content: ""; position: absolute; inset: -5px; border-radius: 14px; border: 2px dashed var(--ring); }
.die.rr .rri { position: absolute; right: -6px; bottom: -6px; width: 20px; height: 20px; border-radius: 50%; background: var(--primary); color: var(--primary-foreground); display: grid; place-items: center; }
.die.rr .rri svg { width: 13px; height: 13px; }
.die.locked { opacity: .6; }
.partner { margin-left: auto; text-align: right; font-size: 13px; color: var(--muted-foreground); line-height: 16px; }
.partner b { color: var(--foreground); font-size: 14px; }
.fd { display: inline-flex; gap: 3px; margin-top: 4px; }
.fd i { width: 13px; height: 13px; border-radius: 3px; background: var(--pc); }
.fd i.out { background: transparent; box-shadow: inset 0 0 0 1.5px var(--border); }
.action { grid-area: action; display: flex; gap: 6px; align-items: center; height: 44px; }
.btn { height: 44px; border-radius: 10px; border: 0; background: var(--secondary); color: var(--secondary-foreground); font: inherit; font-weight: 600; font-size: 15px; padding: 0 14px; display: flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap; }
.btn.pri { background: var(--primary); color: var(--primary-foreground); flex: 1; }
.btn.out { background: transparent; box-shadow: inset 0 0 0 1px var(--border); }
.btn.dis { opacity: .45; }
.btn.sq { width: 52px; padding: 0; gap: 3px; }
.btn.sq b { font-weight: 700; }
.stepper { display: flex; align-items: center; border-radius: 10px; height: 44px; background: var(--secondary); }
.stepper .btn { width: 40px; padding: 0; background: transparent; font-size: 18px; }
.stepper .val { min-width: 44px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 14px; font-weight: 700; line-height: 15px; }
.cups { display: inline-flex; gap: 2px; }
.cups i { width: 8px; height: 8px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px var(--foreground); }
.cups i.f { background: var(--foreground); }

/* sheets over the table: game over */
.scrim { position: absolute; inset: 0; background: var(--shade); z-index: 4; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 5; background: var(--card); border-radius: 18px 18px 0 0; padding: 10px 16px max(16px, env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 12px; box-shadow: 0 -10px 30px var(--shade); }
.sheet .grab { width: 36px; height: 4px; border-radius: 2px; background: var(--border); margin: 0 auto; }
.sheet h2 { margin: 0; font-family: 'Saira', sans-serif; font-stretch: 112%; font-size: 26px; line-height: 1.1; font-weight: 700; }
.sheet p { margin: 0; color: var(--muted-foreground); font-size: 15px; }
.badge { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; padding: 2px 10px 2px 4px; border-radius: 12px; }
.badge.won { background: color-mix(in oklch, var(--led) 25%, var(--card)); }
.badge.lost { background: color-mix(in oklch, var(--destructive) 18%, var(--card)); }
.badge .hz { width: 18px; height: 18px; border-radius: 50%; overflow: hidden; background: linear-gradient(var(--sky) 50%, var(--earth) 50%); rotate: var(--tilt, 0deg); }
.checks { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; font-size: 14px; }
.checks div { display: flex; gap: 8px; align-items: center; }
.checks .chk { width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 800; background: var(--led); color: oklch(0.2 0.05 145); flex: none; }
.checks .chk.no { background: var(--destructive); color: oklch(0.99 0 0); }
.reveal { display: flex; gap: 6px; align-items: center; font-size: 14px; color: var(--muted-foreground); }
.reveal .die { --die: 34px; font-size: 19px; border-radius: 8px; }
.sheet .row { display: flex; gap: 8px; }

/* ---------------- lobby ---------------- */
.lobby { min-height: 100%; display: flex; flex-direction: column; gap: 12px; padding: 12px 12px 0; font-size: 15px; }
.topbar { display: flex; align-items: center; height: 32px; margin: -4px -8px 4px; gap: 6px; font-size: 14px; color: var(--muted-foreground); }
.topbar .lnk { display: flex; align-items: center; gap: 6px; padding: 0 8px; height: 32px; }
.lhd { display: flex; align-items: center; height: 32px; margin: -4px -8px 0; gap: 4px; }
.lhd h1 { margin: 0 0 0 8px; font-size: 18px; font-weight: 600; }
.lhd .hbtn { display: flex; align-items: center; gap: 6px; height: 32px; padding: 0 10px; color: var(--muted-foreground); font-size: 14px; }
.card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.card h3 { margin: 0; font-size: 16px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.card h3 .aside { margin-left: auto; font-size: 13px; font-weight: 500; color: var(--muted-foreground); }
.share h2 { margin: 0; font-family: 'Saira', sans-serif; font-stretch: 112%; font-size: 26px; font-weight: 700; line-height: 1.1; }
.share .cd { display: flex; align-items: baseline; gap: 8px; font-size: 13px; color: var(--muted-foreground); }
.share .cd b { color: var(--foreground); font-size: 16px; letter-spacing: .2em; }
.inp { height: 40px; border-radius: 9px; box-shadow: inset 0 0 0 1px var(--input); display: flex; align-items: center; padding: 0 10px; font-size: 15px; color: var(--muted-foreground); overflow: hidden; white-space: nowrap; }
.seat { display: flex; align-items: center; gap: 10px; height: 44px; }
.seat .role { width: 34px; height: 34px; border-radius: 8px; display: grid; place-items: center; font-family: 'Saira', sans-serif; font-weight: 700; font-size: 13px; }
.seat .role.P { background: var(--pilot); color: var(--pilot-ink); }
.seat .role.C { background: var(--copilot); color: var(--copilot-ink); }
.seat .who { display: flex; flex-direction: column; line-height: 18px; }
.seat .who span { font-size: 13px; color: var(--muted-foreground); }
.scn { display: flex; align-items: stretch; gap: 0; border-radius: 10px; overflow: hidden; background: var(--well); color: var(--gauge-ink); min-height: 64px; }
.scn .band { width: 8px; background: var(--c); flex: none; }
.scn .body { flex: 1; display: flex; align-items: center; gap: 12px; padding: 8px 12px; min-width: 0; }
.scn .apc3 { font-family: 'Saira', sans-serif; font-stretch: 112%; font-weight: 800; font-size: 26px; line-height: 1; letter-spacing: .02em; }
.scn .nm { display: flex; flex-direction: column; min-width: 0; line-height: 18px; }
.scn .nm span { font-size: 13px; opacity: .78; }
.scn .ic { margin-left: auto; display: flex; gap: 4px; align-items: center; }
.scn .ic span { min-width: 24px; padding: 0 3px; gap: 1px; height: 24px; display: inline-flex !important; align-items: center; justify-content: center; border-radius: 6px; background: var(--plane); color: var(--traffic); display: grid; place-items: center; font-size: 12px; font-weight: 800; font-family: 'Saira', sans-serif; }
.scn .ic svg { width: 15px; height: 15px; }
.scn .ic span svg:not(:only-child) { width: 11px; height: 11px; }
.scn.sm { min-height: 52px; }
.scn.sm .apc3 { font-size: 20px; width: 50px; }
.scn.on { box-shadow: 0 0 0 2px var(--card), 0 0 0 4px var(--ring); }
.green { --c: var(--level-green); } .yellow { --c: var(--level-yellow); } .red { --c: var(--level-red); } .black { --c: var(--level-black); }
.black.scn .band { background: repeating-linear-gradient(45deg, var(--level-black) 0 4px, oklch(0.45 0 0) 4px 6px); }
.abs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.ab { border-radius: 10px; padding: 8px 10px 10px; display: flex; flex-direction: column; gap: 4px; box-shadow: inset 0 0 0 1px var(--border); background: var(--card); position: relative; min-height: 92px; }
.ab .t { display: flex; align-items: center; gap: 6px; }
.ab .t b { font-family: 'Saira', sans-serif; font-stretch: 108%; font-weight: 700; font-size: 15px; }
.ab .t .ck { margin-left: auto; width: 20px; height: 20px; border-radius: 6px; box-shadow: inset 0 0 0 1.5px var(--input); display: grid; place-items: center; font-size: 12px; font-weight: 800; }
.ab p { margin: 0; font-size: 13px; line-height: 17px; color: var(--muted-foreground); }
.ab.on { box-shadow: inset 0 0 0 2px var(--ring); background: color-mix(in oklch, var(--primary) 7%, var(--card)); }
.ab.on .ck { background: var(--primary); color: var(--primary-foreground); box-shadow: none; }
.ab.off { opacity: .5; }
.ab .band { height: 4px; border-radius: 2px; background: var(--well); margin: -2px 0 2px; }
.ab.on .band { background: var(--primary); }
.sticky { position: sticky; bottom: 0; margin: auto -12px 0; padding: 8px 12px max(8px, env(safe-area-inset-bottom)); background: color-mix(in oklch, var(--background) 85%, transparent); backdrop-filter: blur(8px); }
.sticky .btn { height: 48px; width: 100%; font-size: 16px; }
.sticky p { margin: 0 0 6px; text-align: center; font-size: 13px; color: var(--muted-foreground); }
.picker .sheet { max-height: 86%; overflow: hidden; }
.picker .list { display: flex; flex-direction: column; gap: 6px; overflow: hidden; }
.grp { font-size: 13px; color: var(--muted-foreground); font-weight: 600; margin: 4px 0 0; }

/* ---------------- start page tiles ---------------- */
.stpage { background: var(--st-background); color: var(--st-foreground); min-height: 100%; padding: 12px; font-family: 'Inter', 'IBM Plex Sans', system-ui, sans-serif; }
.shelf { display: flex; flex-direction: column; gap: 10px; }
.tile { display: flex; align-items: center; gap: 14px; padding: 8px 12px 8px 8px; border-radius: 16px; box-shadow: 0 4px 6px var(--tile-shadow), 0 0 0 1px var(--ring-c); }
.tile .art { width: 88px; height: 88px; border-radius: 12px; overflow: hidden; flex: none; position: relative; }
.tile .art svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.tile h2 { margin: 0; font-size: 18px; line-height: 1.2; font-weight: 800; }
.tile .pl2 { font-size: 14px; }
.tile p { margin: 0; font-size: 14px; opacity: .9; line-height: 1.35; }
.tile .chev { margin-left: auto; flex: none; }
.t-crew { background: var(--crew-tile); --ring-c: color-mix(in oklch, var(--crew-accent) 30%, transparent); color: var(--st-foreground); }
.t-crew h2 { color: var(--crew-text); }
.t-deep { background: var(--deep-tile); --ring-c: color-mix(in oklch, var(--deep-accent) 30%, transparent); color: var(--st-foreground); }
.t-deep h2 { color: var(--deep-text); }
.t-sky { background: var(--sky-tile); --ring-c: var(--sky-ring); color: var(--sky-fg); }
.t-sky h2 { color: var(--sky-text); font-family: 'Saira', sans-serif; font-stretch: 112%; font-weight: 800; }
.t-sky .pl2, .t-sky .chev { color: var(--sky-muted); }
.t-crew .pl2, .t-deep .pl2, .t-crew .chev, .t-deep .chev { color: var(--st-muted); }
.wall { display: grid; grid-template-columns: repeat(3, 296px); gap: 16px; justify-content: center; padding-top: 24px; }
.wall .tile { flex-direction: column; align-items: stretch; gap: 0; padding: 0; overflow: hidden; }
.wall .tile .art { width: 100%; height: 132px; border-radius: 0; }
.wall .tile .txt { padding: 16px 18px 18px; display: flex; flex-direction: column; gap: 2px; }
.wall .tile h2 { font-size: 20px; }
.wall .tile .chev { display: none; }

/* ---------------- desktop (game screen frame ≥ 900 px) ---------------- */
@container (min-width: 900px) {
	.screen {
		--cell: 60px; --die: 64px; --gap: 8px; --tok: 26px;
		grid-template-columns: 1fr 600px 1fr;
		grid-template-rows: 32px 1fr auto auto auto;

function state(key) {

}

// =================================================================== panel parts
function space(id, s) {
	const d = SP[id];
	const placed = s.placed[id];
	const cls = ['sp', d.c];
	if (placed) cls.push('has');
	if (s.legal.includes(id)) cls.push('legal');
	if (s.target === id) cls.push('target');
	if (s.last === id) cls.push('last');
	if (id.startsWith('ice') && s.ice && Number(id[3]) - 2 < s.ice.marker) cls.push('closed');
	if (id.startsWith('brakes') && s.sw.includes(id)) cls.push('closed');
	let inner;
	if (placed) {
		const [o, v] = placed;
		inner = `<div class="pd ${o}">${v}</div>`;
	} else if (d.icon) {
		inner = ic(d.icon, '');
	} else {
		inner = `<span class="v">${d.v}</span>`;
	}
	const led = d.sw ? `<span class="led ${s.sw.includes(id) ? 'on' : ''}">${s.sw.includes(id) ? '✓' : ''}</span>` : '';
	return `<div class="${cls.join(' ')}">${inner}${led}</div>`;
}

function axisGauge(s) {
	let h = '';
	for (let p = -3; p <= 3; p++) {
		const end = Math.abs(p) === 3;
		const cur = p === s.axis;
		h += `<i class="${end ? 'end' : ''} ${cur ? 'cur' : ''} ${p === 0 ? 'zero' : ''}">${end ? '✕' : cur ? sign(p) : ''}</i>`;
	}
	return `<div class="gauge axg" title="Axis">${h}</div>`;
}

function speedGauge(s) {
	if (s.round === 7) {
		const land = [1, 2, 4, 6][s.brakes];
		return `<div class="gauge spd"><div class="land"><b>Land ≤ ${land}</b><span>speed with ${s.brakes} brake${s.brakes === 1 ? '' : 's'}</span></div></div>`;
	}
	return `<div class="gauge spd">
		<div><b>≤${s.blue}</b><span>stay</span></div><i class="mk P"></i>
		<div><b>${s.blue + 1}–${s.orange}</b><span>+1</span></div><i class="mk C"></i>
		<div><b>${s.orange + 1}+</b><span>+2</span></div></div>`;
}

function brakeRows(s) {
	if (s.ice) {
		const cols = [2, 3, 4, 5];
		// The marker sits in a slot between the columns: before 2, after 2, …, past 5.
		const m = s.ice.marker;
		const x = m === 0 ? '4px' : m === 4 ? 'calc(100% - 4px)' : `calc(${m} * (var(--cell) + var(--gap)) - var(--gap) / 2)`;
		const labels = cols.map((c, i) => `<b style="left:calc(${i} * (var(--cell) + var(--gap)))">${c}</b>`).join('');
		return `<div class="prow">${cols.map((c) => space('ice' + c + 't', s)).join('')}</div>
			<div class="icem" title="Ice-brake marker: must end past 5">${labels}<i style="left:${x}"></i></div>
			<div class="prow">${cols.map((c) => space('ice' + c + 'b', s)).join('')}</div>`;
	}
	const land = [1, 2, 4, 6][s.brakes ?? 0];
	return `<div class="prow">${space('brakes2', s)}<span class="arrow">▶</span>${space('brakes4', s)}<span class="arrow">▶</span>${space('brakes6', s)}
		<div class="rd"><span class="mkr"></span>land<b>≤${land}</b></div></div>`;
}

function internBoard(s) {
	if (!s.intern) return '';
	const t = s.intern.toks;
	const live = t.map((_, i) => i).filter((i) => !s.intern.gone.includes(i));
	const left = live[0], right = live[live.length - 1];
	const toks = t.map((v, i) => `<span class="tok ${s.intern.gone.includes(i) ? 'gone' : ''} ${i === left ? 'nP' : ''} ${i === right ? 'nC' : ''}">${v}</span>`).join('');
	return `<div class="intern">${space('internPilot', s)}<div class="toks">${toks}</div>${space('internCopilot', s)}</div>`;
}

function panel(s) {
	const blue = ['radioPilot', 'gear12', 'gear34', 'gear56'];
	const orange = ['radioCopilot1', 'radioCopilot2', 'flaps12', 'flaps23', 'flaps45', 'flaps56'];
	return `<div class="panel ${s.sel !== null ? 'selecting' : ''}">
		<div class="pcol">${blue.map((id) => space(id, s)).join('')}${s.fuel !== undefined ? space('kerosene', s) : ''}</div>
		<div class="pmid">
			<div class="prow">${space('axisPilot', s)}${axisGauge(s)}${space('axisCopilot', s)}</div>
			<div class="prow">${space('enginesPilot', s)}${speedGauge(s)}${space('enginesCopilot', s)}</div>
			${brakeRows(s)}
			<div class="prow">${['conc1', 'conc2', 'conc3'].map((id) => space(id, s)).join('')}</div>
			${internBoard(s)}
		</div>
		<div class="pcol">${orange.map((id) => space(id, s)).join('')}</div>
	</div>`;
}

function approach(s) {
	let h = '';
	for (let i = 0; i < s.N; i++) {
		const n = i + 1;
		const cls = ['apc'];
		if (n < s.pos) cls.push('past');
		if (n === s.pos) cls.push('here');
		if (s.aim === n) cls.push('aim');
		const t = s.turns[i];
		const tm = t ? `<div class="tm">${[...t].map((c, k) => `<i class="${c === 'x' ? 'x' : 'ok'} ${k - 2 === s.axis ? 'cur' : ''}"></i>`).join('')}</div>` : '<div class="tm none"></div>';
		const p = s.planes[i];
		const pl = `<div class="pl">${p > 2 ? ic('plane', '') + `<span class="n">×${p}</span>` : ic('plane', '').repeat(p)}</div>`;
		const tr = `<div class="trf">${'<i></i>'.repeat(n >= s.pos ? s.traffic[i] : 0)}</div>`;
		const apt = n === s.N ? `<span class="apt">${ic('tower', '')}</span>` : '';
		h += `<div class="${cls.join(' ')}" title="Space ${n}">${apt}${n === s.N ? '<div class="tm none"></div>' : tm}${pl}${tr}</div>`;
	}
	return `<div class="ap">${h}</div>`;
}

function altitude(s) {
	return `<div class="alt">${ALT.map((a, i) => {
		const r = i + 1;
		const fp = r % 2 ? 'P' : 'C';
		const rr = (s.rerollOn || []).includes(r) && r > s.round ? ic('reroll', '') : '';
		return `<div class="alc ${fp} ${r === s.round ? 'cur' : ''} ${r < s.round ? 'past' : ''}">${fp === 'P' ? '<span class="ar">◂</span>' : ''}${a}${fp === 'C' ? '<span class="ar">▸</span>' : ''}${rr}</div>`;
	}).join('')}</div>`;
}

function header(s) {
	return `<div class="hd"><span class="code mono">${s.code}</span><span class="dot"></span>
		<span class="lvl ${s.level}">${s.scenario}</span>
		<span class="rnd">Round <b>${s.round}</b> of 7</span>
		<span style="margin-left:auto" class="hb" title="Rules">${ic('help')}</span><span class="hb" title="Give up">${ic('flag')}</span><span class="hb" title="Theme">${ic('theme')}</span></div>`;
}

function mods(s) {
	let h = '';
	if (s.checks) {
		h += s.checks.map(([n, v, ok]) => `<div class="chip ${ok ? 'ok' : 'open'} ${n === 'Planes' ? '' : ''}"><span class="chk">${ok ? '✓' : ''}</span>${n} <b>${v}</b></div>`).join('');
		return `<div class="mods" style="gap:4px">${h}</div>`;
	}
	if (s.fuel !== undefined) h += `<div class="chip grow">${ic('fuel')}<span class="fbar"><i style="left:${(s.fuel / 20) * 100}%"></i></span><b>${s.fuel}</b></div>`;
	if (s.wind) h += `<div class="chip"><span class="ring" style="--rot:${s.wind.off * 18}deg"></span>Wind <b>${sign(s.wind.v)}</b></div>`;
	for (const a of s.abilities) h += `<div class="chip"><span class="ab-dot ${a.used ? 'used' : ''}"></span>${a.n === 'Working together' ? 'Together' : a.n === 'Synchronisation' ? 'Sync' : a.n}<span class="abt">${a.t}</span></div>`;
	// The base game has no modules or abilities: the row is left out (its height goes to the panel).
	return h ? `<div class="mods">${h}</div>` : '';
}

function cups(n) { return `<span class="cups">${[0, 1, 2].map((i) => `<i class="${i < n ? 'f' : ''}"></i>`).join('')}</span>`; }

function hand(s) {
	const me = s.me, pt = me === 'P' ? 'C' : 'P';
	const dice = s.hand.map((v, i) => {
		if (v === null) return `<span class="die empty"></span>`;
		if (v === '?') return `<span class="die ${me} blank">0</span>`;
		const cls = ['die', me];
		if (i === s.sel) cls.push('sel');
		if (s.rr && s.rr.includes(v)) cls.push('rr');
		if (s.phase === 'waiting') cls.push('locked');
		const shown = i === s.sel && s.mod ? v + s.mod : v;
		const mod = i === s.sel && s.mod ? `<span class="mod">${sign(s.mod)}</span>` : '';
		const rri = s.rr && s.rr.includes(v) ? `<span class="rri">${ic('reroll', '')}</span>` : '';
		return `<span class="${cls.join(' ')}">${shown}${mod}${rri}</span>`;
	}).join('');
	const fd = [0, 1, 2, 3].map((i) => `<i class="${i < s.partnerLeft ? '' : 'out'}"></i>`).join('');
	const pc = pt === 'P' ? 'var(--pilot)' : 'var(--copilot)';
	const ready = s.phase === 'discussion' ? '<br>is ready' : `<br>${s.partnerLeft} dice left`;
	return `<div class="hand ${s.phase === 'turn' ? 'mine' : ''}" style="--me:${me === 'P' ? 'var(--pilot)' : 'var(--copilot)'}">${dice}
		<div class="partner"><b>${NAMES[pt]}</b>${ready}<br><span class="fd" style="--pc:${pc}">${fd}</span></div></div>`;
}

function status(s) {
	const pt = NAMES[s.me === 'P' ? 'C' : 'P'];
	if (s.phase === 'discussion') return `<div class="status"><span class="pill wait">Round 4</span><span>Talk strategy now, not dice. ${pt} goes first.</span></div>`;
	if (s.phase === 'waiting') return `<div class="status"><span class="pill wait">${pt}’s turn</span><span>Waiting for ${pt} to place a die.</span></div>`;
	if (s.phase === 'reroll') return `<div class="status"><span class="pill">Reroll</span><span>${pt} spent the reroll. Pick dice to reroll.</span></div>`;
	if (s.phase === 'over') return `<div class="status"></div>`;
	return `<div class="status"><span class="pill">Your turn</span><span>${s.status}</span></div>`;
}

function action(s) {
	const rr = `<span class="btn sq ${s.rerolls ? '' : 'dis'}" title="Spend a reroll">${ic('reroll')}<b>${s.rerolls}</b></span>`;
	if (s.phase === 'reroll') return `<div class="action"><span class="btn out">Keep all</span><span class="btn pri">Reroll 1 die</span></div>`;
	if (s.phase === 'discussion') return `<div class="action"><span class="btn pri">Ready</span></div>`;
	const left = s.coffee - Math.abs(s.mod || 0);
	const on = s.phase === 'turn';
	return `<div class="action"><div class="stepper"><span class="btn ${on ? '' : 'dis'}">−</span><span class="val">${left}${cups(left)}</span><span class="btn ${on ? '' : 'dis'}">+</span></div><span class="btn pri ${on ? '' : 'dis'}">Place</span>${rr}</div>`;
}

function overSheet(s) {
	if (s.over === 'won') {
		return `<div class="scrim"></div><div class="sheet"><div class="grab"></div>
			<span class="badge won"><span class="hz"></span>Landed</span>
			<h2>Touchdown at YUL Montréal-Trudeau</h2>
			<div class="checks"><div><span class="chk">✓</span>No planes left</div><div><span class="chk">✓</span>Gear and flaps down</div>
			<div><span class="chk">✓</span>Axis level</div><div><span class="chk">✓</span>Speed 3, brakes allow 4</div></div>
			<div class="row"><span class="btn pri">Play again</span><span class="btn out">Home</span></div></div>`;
	}
	return `<div class="scrim"></div><div class="sheet"><div class="grab"></div>
		<span class="badge lost"><span class="hz" style="--tilt:-28deg"></span>Lost: collision</span>

		<div class="row"><span class="btn pri">Try again</span><span class="btn out">Home</span></div></div>`;
}

function game(key) {
	const s = state(key);
	return `<div class="screen">${header(s)}
		<div class="track">${approach(s)}${altitude(s)}</div>
		${mods(s)}

// contrast check: oklch -> sRGB luminance
function oklchToLum(str) {
	const m = str.match(/oklch\(([\d.]+)\s+([\d.]+)\s+([\d.]+)/);
	if (!m) return null;
	const [L, C, H] = [+m[1], +m[2], (+m[3] * Math.PI) / 180];
	const a = C * Math.cos(H), b = C * Math.sin(H);
	const l_ = (L + 0.3963377774 * a + 0.2158037573 * b) ** 3;
	const m_ = (L - 0.1055613458 * a - 0.0638541728 * b) ** 3;
	const s_ = (L - 0.0894841775 * a - 1.291485548 * b) ** 3;
	const r = 4.0767416621 * l_ - 3.3077115913 * m_ + 0.2309699292 * s_;
	const g = -1.2684380046 * l_ + 2.6097574011 * m_ - 0.3413193965 * s_;
	const bb = -0.0041960863 * l_ - 0.7034186147 * m_ + 1.707614701 * s_;
	const cl = (x) => Math.min(1, Math.max(0, x));
	return 0.2126 * cl(r) + 0.7152 * cl(g) + 0.0722 * cl(bb);
}
function contrast(fg, bg) {
	const cs = getComputedStyle(document.documentElement);
	const a = oklchToLum(cs.getPropertyValue(fg)), b = oklchToLum(cs.getPropertyValue(bg));
	if (a === null || b === null) return '–';
	return ((Math.max(a, b) + 0.05) / (Math.min(a, b) + 0.05)).toFixed(1);
}

	const fig = (key, w, h, cap) => `<figure class="shot"><div class="fwrap" data-w="${SCREENS[key].w ?? w}">${frame(key, w, h)}</div><figcaption>${cap ?? SCREENS[key].name}${w && h ? ` (${w}×${h})` : ''} · <a href="?s=${key}">open</a></figcaption></figure>`;
	const PAL = [
		['Aluminium', '--panel', 'Panel, its column strips (--panel-strip)'],

		['Co-Pilot orange', '--copilot', 'Co-Pilot dice (dark numerals); spaces --copilot-well with --copilot-glow labels'],
		['Gauge black', '--gauge', 'Axis, speed and ice-marker strips, red crosses (--forbidden)'],
		['Hazard yellow', '--hazard', 'Your plane marker, panel edge marks, turn-mask axis mark; never text'],
		['Switch green', '--led', 'Deployed switches; landing checks'],

		['--foreground', '--background', 'text'], ['--muted-foreground', '--background', 'muted text'], ['--primary-foreground', '--primary', 'button'],
		['--pilot-ink', '--pilot', 'Pilot numeral'], ['--copilot-ink', '--copilot', 'Co-Pilot numeral'],
		['--pilot-glow', '--pilot-well', 'Pilot space label'], ['--copilot-glow', '--copilot-well', 'Co-Pilot space label'],
		['--gauge-ink', '--gauge', 'gauge numbers'], ['--glow', '--well', 'track icons'], ['--ring', '--panel', 'legal ring on panel (mark)'],
		['--led', '--led-off', 'LED on vs off (mark)'], ['--forbidden', '--gauge', 'red cross on gauge (mark)'], ['--pilot', '--pilot-well', 'Pilot die in its well (mark)'], ['--copilot', '--copilot-well', 'Co-Pilot die in its well (mark)'], ['--copilot', '--card', 'Co-Pilot die in the hand (edge ring added)']
	];
	const gameKeys = Object.keys(SCREENS).filter((k) => SCREENS[k].game);
	app.innerHTML = `<div class="doc">
	<h1>Sky Team look</h1>
	<p class="lede">Theme plan and mockup for the new app, layout concept A ("whole cockpit"). The look comes from the box: a brushed-aluminium control panel with navy instrument wells, Pilot spaces in deep blue with ice-blue numerals, Co-Pilot spaces in brick with backlit yellow numerals, black gauge strips with white numbers and red crosses, green switch LEDs, the navy approach and altitude tracks with cyan and yellow frames. The bold part is the dice and wells; page, cards and dialogs stay quiet shadcn.</p>

	<h2>Palette</h2>
	<table><tr><th></th><th>Name</th><th>Token</th><th>Role</th></tr>
	${PAL.map(([n, t, r]) => `<tr><td><span class="sw" style="background:var(${t})"></span></td><td>${n}</td><td class="mono">${t}</td><td>${r}</td></tr>`).join('')}</table>
	<p>Scenario colours (--level-green/yellow/red/black) mark difficulty as on the track headers, always next to the scenario name. Intern tokens are their own green disc (--intern), traffic die black (--traffic), plane tokens white (--plane).</p>
	<h3>Contrast in this mode (switch the system theme or add <span class="mono">?theme=dark</span>)</h3>
	<table><tr><th>Pair</th><th>Use</th><th>Ratio</th></tr>${pairs.map(([f, b, u]) => `<tr><td class="mono">${f} on ${b}</td><td>${u}</td><td>${contrast(f, b)}:1</td></tr>`).join('')}</table>

	<h2>Type</h2>
	<p><span class="display" style="font-size:28px;font-weight:700">Saira</span> (variable, width 112 %, weights 600–800): the display face for the game title, airport codes, altitudes, die numerals and space values, close to the board's wide avionics lettering. <span style="font-size:20px;font-weight:600">IBM Plex Sans</span> (variable): all UI text and numbers, sentence case, tabular figures; the technical-manual voice of a cockpit. Fontsource: <span class="mono">@fontsource-variable/saira</span>, <span class="mono">@fontsource-variable/ibm-plex-sans</span>. Neither is used by another app. Game codes stay mono (shared).</p>

	<h2>Dice and spaces at real size</h2>
	<div class="screen" style="display:block;height:auto;padding:0">
		<div class="dies" style="--die:50px">
			<span class="die P">1</span><span class="die P">6</span><span class="die C">3</span><span class="die C">5</span><span class="die T">4</span>
			<span class="die P sel">2</span><span class="die C sel">4<span class="mod">+1</span></span>
		</div>
		<p class="lede" style="font-size:14px">Hand dice 50 px (56 at 812 px height): blue with white numerals, orange with dark numerals (as the physical dice, so colour is not the only carrier), black traffic die. Selected: lifted with a ring; coffee shows as a badge.</p>
		<div class="panel" style="width:auto;display:inline-flex;--cell:44px">
			<div class="pcol">${['radioPilot', 'gear12', 'gear34'].map((id) => space(id, { ...BASE, sw: ['gear12'], placed: { gear34: ['P', 3] } })).join('')}</div>
			<div class="pmid" style="flex:none">
				<div class="prow">${['conc1', 'kerosene', 'internPilot'].map((id) => space(id, { ...BASE })).join('')}</div>
				<div class="prow">${space('conc2', { ...BASE, placed: { conc2: ['T', 4] } })}${space('axisPilot', { ...BASE, placed: { axisPilot: ['I', 5] } })}${space('brakes2', { ...BASE, legal: ['brakes2'] })}</div>
				<div class="prow">${space('brakes4', { ...BASE, target: 'brakes4', legal: ['brakes4'] })}${space('conc3', { ...BASE, placed: { conc3: ['C', 6] }, last: 'conc3' })}${space('brakes6', { ...BASE, sw: ['brakes6'] })}</div>
			</div>
			<div class="pcol">${['radioCopilot1', 'flaps12', 'flaps23'].map((id) => space(id, { ...BASE, sw: ['flaps12'], placed: { flaps23: ['C', 2] } })).join('')}</div>
		</div>
		<p class="lede" style="font-size:14px">Spaces 44 px at 375×630 (48 px at 812, 60 on desktop). Wells carry an icon (axis, engine, radio, coffee, fuel, intern) or the printed value (gear, flaps, brakes, ice) in the glow colour; a corner LED shows the switch. A placed piece fills the well: die, black traffic die, green intern disc. Legal spaces for the selected die get the ring, the tapped one a thicker ring and a dashed inset; the partner's last placement a cyan dot and ring.</p>
	</div>

	<h2>Start-page tile</h2>
	<p>Art: the attitude indicator from the middle of the board, banked over sky and earth, hazard-yellow aircraft symbol, a blue and an orange die. Name in Saira, instrument navy (light) or the backlit yellow of the Co-Pilot numerals (dark; cyan would collide with The Crew's dark tile). Shown next to The Crew and Deep Sea as they are today.</p>
	<div class="gallery">${fig('tile-shelf', 375, 420)}</div>
	<div class="gallery">${fig('tile-wall', 1280, 420)}</div>

	<h2>Lobby</h2>
	<div class="gallery">${['lobby-host', 'lobby-picker', 'lobby-guest'].map((k) => fig(k, 375, 812)).join('')}</div>

	<h2>Game screen, 375×812</h2>
	<div class="gallery">${gameKeys.map((k) => fig(k, 375, 812)).join('')}</div>
	<h2>Game screen, 375×630</h2>
	<div class="gallery">${gameKeys.map((k) => fig(k, 375, 630)).join('')}</div>
	<h2>Desktop, 1280×800</h2>
	<div class="gallery">${fig('tgu', 1280, 800)}</div>
	</div>`;
	const fit = () => document.querySelectorAll('.fwrap').forEach((w) => { w.style.zoom = Math.min(1, w.parentElement.parentElement.clientWidth / Number(w.dataset.w)); });
	fit();
	addEventListener('resize', fit);
}
</script>
