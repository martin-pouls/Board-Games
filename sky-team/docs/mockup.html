// contrast check: oklch -> sRGB luminance
function oklchToLum(str) {
	const m = str.match(/oklch\(([\d.]+)\s+([\d.]+)\s+([\d.]+)/);
	if (!m) return null;
	const [L, C, H] = [+m[1], +m[2], (+m[3] * Math.PI) / 180];
	const a = C * Math.cos(H), b = C * Math.sin(H);
	const l_ = (L + 0.3963377774 * a + 0.2158037573 * b) ** 3;
	const m_ = (L - 0.1055613458 * a - 0.0638541728 * b) ** 3;
	const s_ = (L - 0.0894841775 * a - 1.291485548 * b) ** 3;
	const r = 4.0767416621 * l_ - 3.3077115913 * m_ + 0.2309699292 * s_;
	const g = -1.2684380046 * l_ + 2.6097574011 * m_ - 0.3413193965 * s_;
	const bb = -0.0041960863 * l_ - 0.7034186147 * m_ + 1.707614701 * s_;
	const cl = (x) => Math.min(1, Math.max(0, x));
	return 0.2126 * cl(r) + 0.7152 * cl(g) + 0.0722 * cl(bb);
}
function contrast(fg, bg) {
	const cs = getComputedStyle(document.documentElement);
	const a = oklchToLum(cs.getPropertyValue(fg)), b = oklchToLum(cs.getPropertyValue(bg));
	if (a === null || b === null) return '–';
	return ((Math.max(a, b) + 0.05) / (Math.min(a, b) + 0.05)).toFixed(1);
}

const params = new URLSearchParams(location.search);
if (params.get('theme')) document.documentElement.dataset.theme = params.get('theme');
const solo = params.get('s');
const app = document.getElementById('app');
const frame = (key, w = 375, h = 812, mode = '') => {
	const sc = SCREENS[key];
	return `<div class="frame ${mode} ${sc.scroll ? 'scroll' : ''}" style="--fw:${sc.w ?? w}px;--fh:${sc.h ?? h}px">${sc.html()}</div>`;
};
// The scenario picker opens scrolled to the chosen scenario.
const scrollPicker = () => document.querySelectorAll('#pick').forEach((p) => { const on = p.querySelector('.scn.on'); if (on) p.scrollTop = on.offsetTop - p.clientHeight / 2; });

if (solo) {
	document.body.classList.add('solo');
	app.innerHTML = frame(solo).replace(/--fw:\d+px;--fh:\d+px/, '--fw:100vw;--fh:100dvh');
	scrollPicker();
} else {
	const pq = () => Object.entries(P).filter(([k, v]) => v !== PICK_DEFAULT[k]).map(([k, v]) => `&${k}=${v}`).join('');
	const fig = (key, w, h, cap, mode = '') => `<figure class="shot"><div class="fwrap" data-w="${SCREENS[key].w ?? w}">${frame(key, w, h, mode)}</div><figcaption>${cap ?? SCREENS[key].name}${w && h ? ` (${w}×${h}${mode === 'dk' ? ', dark' : mode === 'lt' ? ', light' : ''})` : ''} · <a href="?s=${key}${pq()}${mode === 'dk' ? '&theme=dark' : ''}">open</a></figcaption></figure>`;
	const PAL = [
		['Aluminium', '--panel', 'Panel, its column strips (--panel-strip)'],
		['Instrument navy', '--well', 'Track and altitude cells, wells, card banners; primary in light mode'],
		['Pilot blue', '--pilot', 'Pilot dice (white numerals); spaces --pilot-well with --pilot-glow labels'],
		['Co-Pilot orange', '--copilot', 'Co-Pilot dice (dark numerals); spaces --copilot-well with --copilot-glow labels'],
		['Gauge black', '--gauge', 'Axis, speed and ice-marker strips, red crosses and the brake marker (--forbidden)'],
		['Hazard yellow', '--hazard', 'Your plane marker, turn-mask axis mark; never text'],
		['Switch green', '--led', 'Deployed switches, allowed turn-mask positions, the landing band'],
		['Cockpit glow', '--glow', 'Primary in dark mode, focus rings, the current axis position, airport icon']
	];
	const pairs = [
		['--foreground', '--background', 'text'], ['--muted-foreground', '--background', 'muted text'], ['--primary-foreground', '--primary', 'button'],
		['--pilot-ink', '--pilot', 'Pilot numeral'], ['--copilot-ink', '--copilot', 'Co-Pilot numeral'],
		['--pilot-glow', '--pilot-well', 'Pilot space label'], ['--copilot-glow', '--copilot-well', 'Co-Pilot space label'],
		['--gauge-ink', '--gauge', 'gauge numbers'], ['--glow', '--well', 'track icons'], ['--ring', '--panel', 'legal ring on panel (mark)'],
		['--led', '--led-off', 'LED on vs off (mark)'], ['--forbidden', '--gauge', 'red cross, brake marker on gauge (mark)'], ['--pilot', '--pilot-well', 'Pilot die in its well (mark)'], ['--copilot', '--copilot-well', 'Co-Pilot die in its well (mark)'], ['--copilot', '--card', 'Co-Pilot die in the hand (edge ring added)']
	];
	const gameKeys = Object.keys(SCREENS).filter((k) => SCREENS[k].game);

	// The option previews: the piece in question at real size (375×630 phone), light and dark.
	const slice = (s, inner) => `<div class="screen slice ${s.round === 7 ? 'landing' : ''}">${inner}</div>`;
	const crop = (s) => slice(s, `<div class="crop c2">${panel(s)}</div>`);
	const GAUGES = () => [
		['Your turn, axis −1', { ...state('turn'), axis: -1 }],
		['KEF: an engine die previews speed 10', state('kef')],
		['Final round: axis 0, brakes at 4', state('final')]
	];
	const PREVIEW = {
		edge: () => [['Your turn (Pilot)', state('turn'), (s) => slice(s, panel(s))]],
		axis: () => GAUGES().map(([l, s]) => [l, s, crop]),
		speed: () => GAUGES().map(([l, s]) => [l, s, crop]),
		mask: () => [
			...[['TGU red: three turns', state('tgu')], ['KEF black: two turns', state('kef')]].map(([l, s]) => [l, s, (x) => slice(x, `<div class="track">${approach(x)}${altitude(x)}</div>`)]),
			['TGU’s masks, 2.5× close-up', state('tgu'), (x) => `<div class="closeup">${x.turns.filter(Boolean).map((t) => `<span class="apc">${turnMask(t, x.axis)}</span>`).join('')}</div>`]
		],
		abil: () => [['TGU: Sync used, Together ready', state('tgu')], ['KEF: Anticipation used, Adaptation ready', state('kef')], ['HND: Control used', state('hnd')]].map(([l, s]) => [l, s, (x) => slice(x, mods(x))])
	};
	const optCard = (key, k, [title, why], on = P[key] === k) => withPick({ [key]: k }, () => `<div class="opt ${on ? 'chosen' : ''}" data-pick="${key}:${k}">
		<div class="oh"><b>${title}</b>${OPTS[key].rec === k ? '<span class="rec">Recommended</span>' : ''}<button class="pk" type="button">${on ? 'Picked' : 'Pick'}</button></div>
		<p class="why">${why}</p>
		${['lt', 'dk'].map((m) => `<div class="ov ${m}">${PREVIEW[key]().map(([l, s, f]) => `<p class="lbl">${l}</p>${f(s)}`).join('')}</div>`).join('')}
	</div>`);
	const decisions = () => Object.entries(OPTS).map(([key, d], i) => `<section class="dec"><h3>${i + 1}. ${d.title}</h3><p>${d.ask}</p>
		<div class="opts">${Object.entries(d.o).map(([k, o]) => optCard(key, k, o)).join('')}</div></section>`).join('');
	const pickSummary = () => `<div class="picks">${Object.entries(OPTS).map(([key, d]) => `<span>${d.title.split(':')[0]}: <b>${d.o[P[key]][0]}</b></span>`).join('')}</div>`;
	const PREVIEW_KEYS = ['turn', 'tgu', 'kef', 'hnd', 'final'];

	const render = () => {
		app.innerHTML = `<div class="doc">
	<h1>Sky Team look</h1>
	<p class="lede">Round 3: locked. The UX is final; a UI polish pass on the real components follows once the table is built (list below). The option rows stay for reference and still switch the previews.</p>

	<h2>Locked</h2>
	<ul>
		<li><b>Start-page tile: B, final approach</b> (sunrise over the lit runway, airliner head-on). Its strip is the home screen's band. The A and C options are gone.</li>
		<li><b>Round 3:</b> no edge marks; the axis as a dial (closest to the physical game); speed as three ranges; green turn masks on the white strip; one icon per ability, dashed with a check when used.</li>
		<li><b>Everything else from round 2:</b> palette and type, headers, the table layout (tracks, chip row, panel, dice tray, action bar), dice and spaces, reroll tokens, the lobby with the scenario picker and ability cards, game over, desktop. Collapsed at the bottom.</li>
	</ul>

	<h2>Polish pass (after the table is built)</h2>
	<ul>
		<li><b>Speed strip:</b> uneven in some states, worst in the final round, where "✓ land" overlaps its narrow segment. Copy follows the rule: "&lt; 5" with the marker, not "≤ 4".</li>
		<li><b>Axis dial:</b> a second design pass towards the physical gauge: black bezel with white triangle ticks and a hollow zero mark, red crosses at the ends, sky and ground disc behind a plane silhouette that banks.</li>
	</ul>

	<h2>Round 3 decisions</h2>
	${pickSummary()}
	${decisions()}

	<h2>Your picks on the table</h2>
	${pickSummary()}
	<div class="gallery">${PREVIEW_KEYS.map((k) => fig(k, 375, 812, null, 'lt')).join('')}</div>
	<div class="gallery">${PREVIEW_KEYS.map((k) => fig(k, 375, 812, null, 'dk')).join('')}</div>
	<div class="gallery">${['tgu', 'hnd'].map((k) => fig(k, 375, 630, null, 'lt')).join('')}${['tgu', 'hnd'].map((k) => fig(k, 375, 630, null, 'dk')).join('')}</div>
	<div class="gallery">${fig('desktop', 1280, 800)}</div>

	<details><summary>Locked: round 2 in full</summary>
	<h2>Palette</h2>
	<table><tr><th></th><th>Name</th><th>Token</th><th>Role</th></tr>
	${PAL.map(([n, t, r]) => `<tr><td><span class="sw" style="background:var(${t})"></span></td><td>${n}</td><td class="mono">${t}</td><td>${r}</td></tr>`).join('')}</table>
	<p>Scenario colours (--level-green/yellow/red/black) mark difficulty as on the track headers, always next to the scenario code. Intern tokens are their own green disc (--intern), traffic die black (--traffic), plane tokens white (--plane).</p>
	<h3>Contrast in this mode (switch the system theme or add <span class="mono">?theme=dark</span>)</h3>
	<table><tr><th>Pair</th><th>Use</th><th>Ratio</th></tr>${pairs.map(([f, b, u]) => `<tr><td class="mono">${f} on ${b}</td><td>${u}</td><td>${contrast(f, b)}:1</td></tr>`).join('')}</table>

	<h2>Type</h2>
	<p><span class="display" style="font-size:28px;font-weight:700">Saira</span> (variable, width 112 %, weights 600–800): the display face for the game title, airport codes, altitudes, die numerals and space values, close to the board's wide avionics lettering; the gauges use its 75–80 % width. <span style="font-size:20px;font-weight:600">IBM Plex Sans</span> (variable): all UI text and numbers, sentence case, tabular figures. Fontsource: <span class="mono">@fontsource-variable/saira</span>, <span class="mono">@fontsource-variable/ibm-plex-sans</span>. Game codes stay mono (shared).</p>

	<h2>Dice and spaces at real size</h2>
	<div class="screen" style="display:block;height:auto;padding:0">
		<div class="dies" style="--die:52px">
			<span class="die P">1</span><span class="die P">6</span><span class="die C">3</span><span class="die C">5</span><span class="die T">4</span>
			<span class="die P sel">2</span><span class="die C sel">4<span class="mod">+1</span></span>${rtok()}<span style="--rt:24px;display:contents">${rtok()}</span>
		</div>
		<p class="lede" style="font-size:14px">Hand dice 52 px (58 at 812 px height): blue with white numerals, orange with dark numerals, black traffic die. Selected: lifted with a ring; coffee shows as a badge. The reroll token at its two sizes.</p>
		<div class="panel edge-${P.edge}" style="width:auto;display:inline-flex;--cell:47px">
			<div class="pcol">${['radioPilot', 'gear12', 'gear34'].map((id) => space(id, { ...BASE, sw: ['gear12'], placed: { gear34: ['P', 3] } })).join('')}</div>
			<div class="pmid" style="flex:none">
				<div class="prow">${['conc1', 'kerosene', 'internPilot'].map((id) => space(id, { ...BASE })).join('')}</div>
				<div class="prow">${space('conc2', { ...BASE, placed: { conc2: ['T', 4] } })}${space('axisPilot', { ...BASE, placed: { axisPilot: ['I', 5] } })}${space('axisCopilot', { ...BASE, legal: ['axisCopilot'] })}</div>
				<div class="prow">${space('brakes4', { ...BASE, target: 'brakes4', legal: ['brakes4'] })}${space('conc3', { ...BASE, placed: { conc3: ['C', 6] }, last: 'conc3' })}${space('brakes6', { ...BASE, sw: ['brakes6'] })}</div>
			</div>
			<div class="pcol">${['radioCopilot1', 'flaps12', 'flaps23'].map((id) => space(id, { ...BASE, sw: ['flaps12'], placed: { flaps23: ['C', 2] } })).join('')}</div>
		</div>
		<p class="lede" style="font-size:14px">Spaces 47 px at 375×630 (50 px at 812, 64 on desktop). Wells carry an icon or the printed value in the glow colour; a corner LED shows the switch. A placed piece fills the well. Legal spaces for the selected die get the ring, the tapped one a thicker ring and a dashed inset; the partner's last placement a cyan dot and ring.</p>
	</div>

	<h2>Start page and home</h2>
	<div class="gallery">${fig('tile-shelf', 375, 420)}${fig('tile-wall', 1280, 420)}</div>
	<div class="gallery">${fig('home', 375, 812)}</div>

	<h2>Lobby</h2>
	<div class="gallery">${['lobby-host', 'lobby-picker', 'lobby-module', 'lobby-ability', 'lobby-guest'].map((k) => fig(k, 375, 812)).join('')}</div>

	<h2>Game screen, 375×812</h2>
	<div class="gallery">${gameKeys.map((k) => fig(k, 375, 812)).join('')}</div>
	<h2>Game screen, 375×630</h2>
	<div class="gallery">${gameKeys.map((k) => fig(k, 375, 630)).join('')}</div>
	</details>
	</div>`;
		scrollPicker();
		fit();
	};
	const fit = () => document.querySelectorAll('.fwrap').forEach((w) => { w.style.zoom = Math.min(1, w.parentElement.parentElement.clientWidth / Number(w.dataset.w)); });
	// Picking re-renders in place and keeps the picks in the URL (so "open" links and a reload keep them).
	app.addEventListener('click', (e) => {
		const card = e.target.closest('[data-pick]');
		if (!card || e.target.closest('a')) return;
		const [key, k] = card.dataset.pick.split(':');
		if (P[key] === k) return;
		P[key] = k;
		try {
			const q = new URLSearchParams(location.search);
			for (const [kk, v] of Object.entries(P)) { if (v === PICK_DEFAULT[kk]) q.delete(kk); else q.set(kk, v); }
			history.replaceState(null, '', '?' + q.toString() + location.hash);
		} catch {}
		const y = scrollY;
		render();
		scrollTo(0, y);
	});
	render();
	addEventListener('resize', fit);
}
</script>
