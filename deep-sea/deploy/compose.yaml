# Mission Deep Sea on the server: one container behind the shared Caddy proxy (deploy/caddy at the
# repo root), reachable only over the external "web" network. Caddy maps /deep-sea/* to it.
# The app has no code of its own: it is The Crew (the-crew/) built as the Deep Sea edition.
name: deep-sea

services:
  app:
    build:
      # The repository root: the image is built from the-crew/ and shared/ (see the-crew/Dockerfile).
      context: ../..
      dockerfile: the-crew/Dockerfile
      args:
        BASE_PATH: /deep-sea
        EDITION: deepSea
        DB_FILE: deep-sea.db
    # Built by CI for each commit; on the server TAG comes from deploy/.env (see deploy/server/).
    image: ghcr.io/martin-pouls/board-games/deep-sea:${TAG:-latest}
    container_name: deep-sea
    restart: unless-stopped
    environment:
      # A crew plays its missions over many evenings: keep idle games (and their logbook) longer
      # than the default 7 days. The privacy policy states this.
      GAME_RETENTION: 720h
    volumes:
      - data:/data # SQLite DB: games survive redeploys
    networks:
      - web

volumes:
  data:

networks:
  web:
    external: true
